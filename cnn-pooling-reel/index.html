// ------------------------------------------------------------------ captions
function buildCaptions() {
  const words = TM.words.map(w => ({ w: w.w, s: warp(w.start), e: warp(w.end) }));
  CAPS = [];
  let cur = [];
  const flush = () => { if (cur.length) CAPS.push({ words: cur, s: cur[0].s, e: cur[cur.length - 1].e }); cur = []; };
  for (const w of words) {
    if (/^[A-D]\.$/.test(w.w)) flush();
    cur.push(w);
    const len = cur.map(x => x.w).join(' ').length;
    if (/[.?!]$/.test(w.w) && !/^[A-D]\.$/.test(w.w)) flush();
    else if (/,$/.test(w.w) && len > 16) flush();

  flush();

  for (let i = CAPS.length - 1; i > 0; i--) {

    ctx.strokeStyle = C.terra; ctx.lineWidth = 7; ctx.stroke(); ctx.restore();
    // window label
    chip('2 × 2 window', wx + cs, wy - 8, { size: 24, weight: 700, h: 44, fill: C.terra, color: '#fff', stroke: null, alpha: wv.vis });
  }
  // stride indicators
  const strideMoves = [[1, 'stride 2  →', 0, 1], [2, 'stride 2  ↓  (next row)', 1, 0], [3, 'stride 2  →', 1, 1]];
  for (const [i, label] of strideMoves) {
    const k = win(t, T.reg[i] - .05, T.reg[i] + .85, .2);
    if (k <= 0.001) continue;
    chip(label, x + 2 * cs, y + 4 * cs + 70, { size: 26, weight: 600, h: 50, alpha: k, color: C.terra, stroke: rgba(C.terra, .45) });
  }
  if (win(t, T.stride - .05, T.stride + .9, .2) > 0) {
    const k = easeInOut(prog(t, T.stride, T.stride + .45)), a = win(t, T.stride - .05, T.stride + .9, .2);
    ctx.save(); ctx.globalAlpha *= a;
    arrow(x + cs * .5, y - 12, x + cs * .5 + 2 * cs * k + 1, y - 12, 1, C.terra, 4, 14); ctx.restore();
  }
  // operator label between input and output
  arrow(540, y + 4 * cs + 108, 540, oy - 44, fadeIn(t, T.pool + .2, .6) * (1 - prog(t, T.half + .8, T.half + 1.1)), C.muted, 4);
  // output grid
  const ao = fadeIn(t, T.pool + .25, .5);
  card(ox - 30, oy - 30, 2 * ocs + 60, 2 * ocs + 60, 30, ao);
  for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) {
    const i = r * 2 + c, v = POOL.out[r][c];
    const land = prog(t, T.reg[i] + .55, T.reg[i] + 1.0);
    const xx = ox + c * ocs, yy = oy + r * ocs;
    ctx.save(); ctx.globalAlpha *= ao; rr(xx + 3, yy + 3, ocs - 6, ocs - 6, 14); ctx.fillStyle = '#F4EFE7'; ctx.fill();
    ctx.setLineDash([8, 7]); ctx.lineWidth = 2; ctx.strokeStyle = '#D8CDBD'; ctx.stroke(); ctx.restore();
    const sg = win(t, T.strong - .1, T.strong + 1.6, .35);
    if (land >= 1) {
      if (sg > 0) { ctx.save(); ctx.globalAlpha *= sg; ctx.shadowColor = rgba(C.terra, .8); ctx.shadowBlur = 40; rr(xx + 6, yy + 6, ocs - 12, ocs - 12, 16); ctx.fillStyle = rgba(C.terra, .3); ctx.fill(); ctx.restore(); }
      numCell(xx, yy, ocs, v, 8, { size: 58 });
    }
    // flying value
    const fk = prog(t, T.reg[i] + .5, T.reg[i] + 1.0);
    if (fk > 0 && fk < 1) {
      const [mr, mc] = POOL.arg[r][c];
      const x1 = x + mc * cs + cs / 2, y1 = y + mr * cs + cs / 2, x2 = xx + ocs / 2, y2 = yy + ocs / 2;
      const e = easeInOut(fk);
      const px = lerp(x1, x2, e) + Math.sin(e * Math.PI) * (c ? 70 : -70), py = lerp(y1, y2, e);
      ctx.save(); ctx.shadowColor = 'rgba(80,50,30,.25)'; ctx.shadowBlur = 20;
      rr(px - 46, py - 46, 92, 92, 18); ctx.fillStyle = C.terra; ctx.fill(); ctx.restore();
      text(String(v), px, py + 3, { font: SERIF, size: 54, weight: 600, align: 'center', base: 'middle', color: '#fff' });
    }
  }
  text('Pooled output', ox - 52, oy + ocs + 10, { size: 28, weight: 600, color: C.muted, align: 'right', alpha: ao });
  // "half its original height and width": dimension brackets
  const ah = fadeIn(t, T.half - .05, .5);
  bracket(x, y - 50 - 0, x + 4 * cs, 0, 'W = 4', ah * (1 - wv.vis), 'top');
  bracket(x - 64, y, 0, y + 4 * cs, 'H = 4', ah, 'left');
  const ah2 = fadeIn(t, T.half + .5, .5);
  bracket(ox + 2 * ocs + 64, oy, 0, oy + 2 * ocs, 'H = 2', ah2, 'left');
  bracket(ox, oy + 2 * ocs + 52, ox + 2 * ocs, 0, 'W = 2', ah2, 'top');
  // summary
  const as = fadeIn(t, T.half + 1.0, .6);
  ctx.restore();
  // summary chips under the output (kept above the caption zone)
  ctx.save(); ctx.globalAlpha = fadeOut;
  const sk = fadeIn(t, T.half + 1.0, .6);
  const yS = y + 4 * cs + 80;
  chip('4 × 4  →  2 × 2', 540 - 180, yS, { font: SERIF, size: 34, weight: 600, h: 64, alpha: sk, scale: .92 + .08 * easeOutBack(prog(t, T.half + 1, T.half + 1.5)) });
  chip('16 → 4 positions  (¼)', 540 + 170, yS, { size: 27, weight: 600, h: 64, alpha: fadeIn(t, T.half + 1.4, .6), color: C.terra, stroke: rgba(C.terra, .4) });
  ctx.restore();
}

// ------------------------------------------------------------------ scene 3
const S3 = { gx: 84, cs: 96, ox: 700, ocs: 96, rowA: 352, rowB: 892 };
function smallGrid(m, gx, gy, cs, vmax, alpha, opts = {}) {
  for (let r = 0; r < m.length; r++) for (let c = 0; c < m[0].length; c++) {
    if (opts.skip && opts.skip(r, c)) { cell(gx + c * cs, gy + r * cs, cs, 0, { alpha }); continue; }
    numCell(gx + c * cs, gy + r * cs, cs, m[r][c], vmax, { alpha, size: 40 });
  }
}
function regionBox(gx, gy, cs, a, t) {
  if (a <= 0.001) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.setLineDash([14, 10]); ctx.lineDashOffset = -t * 30;
  ctx.strokeStyle = C.terra; ctx.lineWidth = 5; rr(gx - 6, gy - 6, 2 * cs + 12, 2 * cs + 12, 18); ctx.stroke(); ctx.restore();
}
function scene3(t) {
  const A = Math.min(prog(t, T.s3 - .25, T.s3 + .35), 1 - prog(t, T.q - .35, T.q + .1));
  if (A <= 0.001) return;
  const { gx, cs, ox, ocs, rowA, rowB } = S3;
  ctx.save(); ctx.globalAlpha = easeInOut(A);
  const rows = [
    { y: rowA, m: SA, P: POOLA, label: 'Original feature map', t0: T.s3, tp: T.s3 + .7 },
    { y: rowB, m: SB, P: POOLB, label: 'Activation shifted one cell →', t0: T.shift - .55, tp: T.region + .55 },
  ];
  rows.forEach((R, i) => {
    const a = fadeIn(t, R.t0, .55);
    if (a <= 0.001) return;
    ctx.save(); ctx.translate(0, (1 - a) * 24);
    card(gx - 30, R.y - 70, 4 * cs + 60, 4 * cs + 100, 28, a);
    text(R.label, gx, R.y - 26, { size: 28, weight: 600, alpha: a, color: i ? C.terra : C.ink });
    if (i === 0) smallGrid(R.m, gx, R.y, cs, 9, a);
    else {
      // shifted map: identical to the original except the 9 slides from (0,0) to (0,1)
      const k = easeInOut(prog(t, T.shift + .15, T.shift + 1.0));
      smallGrid(SA, gx, R.y, cs, 9, a, { skip: (r, c) => r === 0 && c < 2 });
      // left cell: 9 -> 1, right cell: 1 -> 9 (the activation travels right)
      numCell(gx, R.y, cs, 1, 9, { alpha: a * k, size: 40 });
      numCell(gx + cs, R.y, cs, 1, 9, { alpha: a * (1 - k), size: 40 });
      numCell(gx + lerp(0, cs, k), R.y, cs, 9, 9, { alpha: a, size: 40 });
      const ak = win(t, T.shift + .1, T.unch + 1.5, .3);
      if (ak > 0) arrow(gx + cs * .3, R.y + cs + 1, gx + cs * 1.7, R.y + cs + 1, easeOut(prog(t, T.shift + .1, T.shift + .9)), C.terra, 4, 14);
    }
    // same 2x2 region outline (both maps)
    regionBox(gx, R.y, cs, fadeIn(t, T.region - .05, .4), t);
    // pooling arrow + output
    const ap = fadeIn(t, R.tp - .3, .5);
    const oy = R.y + cs;
    arrow(gx + 4 * cs + 40, R.y + 2 * cs, ox - 40, R.y + 2 * cs, ap, C.muted, 4);
    text('max pool', (gx + 4 * cs + ox) / 2, R.y + 2 * cs - 22, { size: 24, weight: 600, color: C.muted, align: 'center', alpha: ap });
    text('2 × 2, s = 2', (gx + 4 * cs + ox) / 2, R.y + 2 * cs + 46, { size: 22, color: C.muted, align: 'center', alpha: ap });
    card(ox - 24, oy - 24, 2 * ocs + 48, 2 * ocs + 48, 24, ap);
    for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) {
      const kk = fadeIn(t, R.tp + (r * 2 + c) * .12, .4);
      numCell(ox + c * ocs, oy + r * ocs, ocs, R.P.out[r][c], 9, { alpha: ap * kk, size: 40 });
    }
    // highlight of the top-left pooled value at "unchanged"
    const hu = fadeIn(t, T.unch - .1, .4);
    if (hu > 0) { ctx.save(); ctx.globalAlpha *= hu; ctx.strokeStyle = C.ink; ctx.lineWidth = 5; rr(ox - 2, oy - 2, ocs + 4, ocs + 4, 16); ctx.stroke(); ctx.restore(); }
    ctx.restore();
  });
  // comparison connector between the two top-left outputs
  const hu = fadeIn(t, T.unch - .1, .5);
  if (hu > 0) {
    const x = ox + ocs / 2, y1 = rowA + 2 * cs + 34, y2 = rowB + cs - 34;
    ctx.save(); ctx.globalAlpha *= hu; ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.setLineDash([6, 8]);
    ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, lerp(y1, y2, easeInOut(prog(t, T.unch, T.unch + .6)))); ctx.stroke(); ctx.restore();
    chip('9  =  9', x, (y1 + y2) / 2, { font: SERIF, size: 34, weight: 600, h: 62, alpha: fadeIn(t, T.unch + .35, .4), fill: C.ink, color: '#fff', stroke: null });
    text('same pooled value', x + 96, (y1 + y2) / 2 + 9, { size: 26, color: C.muted, alpha: fadeIn(t, T.unch + .5, .4) });
  }
  const an = fadeIn(t, T.region + .1, .5);
  chip('Shift stays inside the same 2 × 2 region', 540, rowB + 4 * cs + 92, { size: 27, weight: 600, h: 58, alpha: an, color: C.terra, stroke: rgba(C.terra, .4) });
  ctx.restore();
}

// ------------------------------------------------------------------ scene 4/5
const QUESTION = 'Why does max pooling preserve strong activations while reducing spatial dimensions?';
function optionLayout() {
  if (optionLayout.cache) return optionLayout.cache;
  const qLines = wrap(QUESTION, 860, 48, 600, SERIF);
  const qH = 100 + qLines.length * 62 + 26;
  const opts = TM.blocks.filter(b => b.option).map(b => ({ letter: b.option, lines: wrap(b.text.slice(3), 770, 34, 400) }));
  let y = 282 + qH + 24;
  for (const o of opts) { o.y = y; o.h = 50 + o.lines.length * 45; y += o.h + 18; }
  return optionLayout.cache = { qLines, qH, opts, bottom: y };
}
function scene4(t) {
  const a = prog(t, T.q, T.q + .6);
  if (a <= 0.001) return;
  const L = optionLayout();
  ctx.save(); ctx.globalAlpha = easeInOut(a);
  const kq = easeOut(prog(t, T.q, T.q + .7));
  ctx.save(); ctx.translate(0, (1 - kq) * 28);
  card(56, 282, 968, L.qH, 34);
  asterisk(104, 340, 16, t * .25, C.terra, 1);
  text('QUESTION', 132, 350, { size: 25, weight: 700, color: C.terra, spacing: 3 });
  L.qLines.forEach((ln, i) => text(ln, 92, 282 + 100 + 44 + i * 62, { font: SERIF, size: 48, weight: 600 }));
  ctx.restore();
  for (const o of L.opts) {
    const s = T.opt[o.letter], e = T.optEnd[o.letter];
    const k = prog(t, s - .2, s + .45);
    if (k <= 0) continue;
    const ke = easeOut(k);
    // identical, neutral "now reading" highlight for every option; none persists
    const reading = clamp(prog(t, s - .2, s + .2)) * (1 - prog(t, e + .1, e + .5));
    ctx.save(); ctx.globalAlpha *= ke; ctx.translate(56 + (1 - ke) * 46, o.y);
    card(0, 0, 968, o.h, 26, 1, { stroke: mix(C.border, C.burnt, reading), lw: 2 + reading * 1.5 });
    if (reading > .001) { ctx.save(); ctx.globalAlpha *= reading; rr(0, 18, 7, o.h - 36, 3.5); ctx.fillStyle = C.burnt; ctx.fill(); ctx.restore(); }
    ctx.beginPath(); ctx.arc(64, o.h / 2, 31, 0, Math.PI * 2); ctx.fillStyle = C.beige; ctx.fill();
    text(o.letter, 64, o.h / 2 + 2, { font: SERIF, size: 36, weight: 700, align: 'center', base: 'middle' });
    const ty = o.h / 2 - (o.lines.length - 1) * 22.5 + 12;
    o.lines.forEach((ln, i) => text(ln, 122, ty + i * 45, { size: 34 }));
    ctx.restore();
  }
  ctx.restore();
}
function scene5(t) {
  const a = prog(t, T.think, T.think + .5);
  if (a <= 0.001) return;
  const L = optionLayout();
  const cy = Math.max(L.bottom + 120, 1490);
  const t0 = T.think, t1 = TOTAL - .45, span = t1 - t0;
  const rem = clamp(1 - (t - t0) / span);
  ctx.save(); ctx.globalAlpha = easeInOut(a);
  const cx = 296, R = 62;
  const pulse = .5 + .5 * Math.sin((t - t0) * Math.PI * 2 / 1.6);
  ctx.beginPath(); ctx.arc(cx, cy, R + 14 + pulse * 6, 0, Math.PI * 2); ctx.fillStyle = rgba(C.terra, .06 + pulse * .04); ctx.fill();
  ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.strokeStyle = C.sand; ctx.stroke();
  if (rem > .002) { ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * rem); ctx.strokeStyle = C.terra; ctx.stroke(); }
  text(String(Math.max(0, Math.ceil(rem * span))), cx, cy + 3, { font: SERIF, size: 50, weight: 600, align: 'center', base: 'middle' });
  text('PAUSE & THINK', 394, cy - 6, { size: 44, weight: 800, spacing: 4, color: C.ink });
  text('Verify it on a tiny feature map', 394, cy + 42, { size: 28, color: C.muted });
  ctx.restore();
}

// ------------------------------------------------------------------ subtitles
function drawCaption(t) {
  let cap = null, ci = -1;
  for (let i = 0; i < CAPS.length; i++) {
    const c = CAPS[i], nx = CAPS[i + 1];
    const end = nx ? Math.min(nx.s - .04, c.e + .8) : Math.min(c.e + .35, T.think);
    if (t >= c.s - .12 && t < end) { cap = c; ci = i; break; }
  }
  if (!cap) return;
  const nx = CAPS[ci + 1];
  const end = nx ? Math.min(nx.s - .04, cap.e + .8) : Math.min(cap.e + .35, T.think);
  const contiguous = nx && nx.s - .04 < cap.e + .8;
  const a = Math.min(easeOut(prog(t, cap.s - .12, cap.s + .04)), contiguous ? 1 : 1 - prog(t, end - .22, end));
  const size = 42, maxW = 800;
  const items = cap.words.map(w => ({ ...w, width: measure(w.w, size, 600) }));
  const sp = measure(' ', size, 600);
  const lines = [[]]; let lw = 0;
  for (const w of items) {
    if (lines[lines.length - 1].length && lw + sp + w.width > maxW) { lines.push([]); lw = 0; }
    lw += (lines[lines.length - 1].length ? sp : 0) + w.width; lines[lines.length - 1].push(w);
  }
  const lineH = 56, boxH = lines.length * lineH + 40;
  const widths = lines.map(l => l.reduce((s, w, i) => s + w.width + (i ? sp : 0), 0));
  const boxW = Math.max(...widths) + 72;
  const top = t > T.q - .2 ? Math.max(1430, optionLayout().bottom + 46) : 1450;
  const cx = 520;     // nudged left of Instagram's right-hand action buttons
  ctx.save(); ctx.globalAlpha = a;
  ctx.shadowColor = 'rgba(80,55,30,.08)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;
  rr(cx - boxW / 2, top, boxW, boxH, 26); ctx.fillStyle = 'rgba(255,253,249,0.96)'; ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.lineWidth = 2; ctx.strokeStyle = C.border; ctx.stroke();
  lines.forEach((l, li) => {
    let x = cx - widths[li] / 2;
    const y = top + 20 + lineH * li + lineH / 2 + 2;
    for (const w of l) {
      const now = t >= w.s - .03 && t < w.e + .05;
      const said = t >= w.e;
      text(w.w, x, y, { size, weight: 600, base: 'middle', color: now ? C.terra : C.ink, alpha: now || said ? 1 : .4 });
      x += w.width + sp;
    }
  });
  ctx.restore();
}

function drawFadeOut(t) {
  const k = prog(t, TOTAL - .6, TOTAL - .05);
  if (k > 0) { ctx.save(); ctx.globalAlpha = easeInOut(k); ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  const kin = 1 - prog(t, 0, .4);          // gentle fade-in from the background
  if (kin > 0) { ctx.save(); ctx.globalAlpha = kin; ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}

// ------------------------------------------------------------------ draw(t)
function draw(t) {
  if (!T) setup();
  t = clamp(t, 0, TOTAL);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // faint decorative asterisk watermark
  asterisk(980, 1780, 46, t * .05, C.sand, .55);
  drawHeader(t);
  if (t < T.zoomB + .1) scene1(t);
  if (t > T.zoomA - .01 && t < T.s3) scene2(t);
  if (t > T.s3 - .3 && t < T.q + .2) scene3(t);
  if (t > T.q) scene4(t);
  scene5(t);
  drawCaption(t);
  drawFadeOut(t);
}
window.draw = draw;

// ------------------------------------------------------------------ live preview
async function ensureData() { if (!window.TIMING) window.TIMING = await fetch('timings.json').then(r => r.json()); }
window.ready = ensureData().then(setup);
if (!window.__RENDERING) {
  window.ready.then(() => {
    const aud = document.getElementById('aud'), btn = document.getElementById('play'), seek = document.getElementById('seek');
    const tl = document.getElementById('time'), snd = document.getElementById('sound');
    let playing = false, base = 0, t0 = 0, sound = true, scrub = 0;
    const now = () => playing ? (sound && !aud.paused ? aud.currentTime : base + (performance.now() - t0) / 1000) : scrub;
    const start = () => {
      playing = true; base = scrub >= TOTAL ? 0 : scrub; t0 = performance.now(); btn.textContent = '❚❚ Pause';
      if (sound) { aud.currentTime = base; aud.play().catch(() => { sound = false; snd.textContent = 'Sound: n/a'; }); }
    };
    const stop = () => { scrub = now(); playing = false; aud.pause(); btn.textContent = '▶ Play'; };
    btn.onclick = () => playing ? stop() : start();
    snd.onclick = () => { const t = now(); sound = !sound; snd.textContent = 'Sound: ' + (sound ? 'on' : 'off'); if (playing) { stop(); scrub = t; start(); } };
    seek.oninput = () => { const was = playing; if (playing) stop(); scrub = +seek.value; if (was) start(); };
    document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); btn.onclick(); } });
    const loop = () => {
      let t = now();
      if (t >= TOTAL) { if (playing) stop(); scrub = t = TOTAL; }
      draw(t); seek.value = t; tl.textContent = t.toFixed(2) + ' s';
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
}
</script>
