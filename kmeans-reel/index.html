<script>
'use strict';
// ============================================================================
//  Deterministic K-Means reel.  draw(t) renders the exact frame at time t (s).
//  All clustering states come from clustering_data.json (precomputed + validated
//  Lloyd iterations); all timing comes from ElevenLabs alignment via timing.json.
// ============================================================================
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  bg: '#F7F5F0', ink: '#292622', terra: '#C46A4A', orange: '#E5A17B', teal: '#6F9D94',
  blue: '#7E9DB8', card: '#FFFFFF', border: '#E8E2D8', muted: '#857D72', beige: '#EFE9DF',
  sand: '#E9E1D3', gray: '#BDB4A6'
};
const SERIF = '"Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif';
const SANS = '-apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif';

// ---------------------------------------------------------------- math utils
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeOutBack = k => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
// opacity of a window [a,b] with fade f in & out
const win = (t, a, b, f = .45) => Math.min(easeInOut(prog(t, a, a + f)), 1 - easeInOut(prog(t, b - f, b)));
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixRGB = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ------------------------------------------------------------- time warp
let D, TM, T, CAPS, RUNS, ORDER, TOTAL;
function warp(n) {             // narration-time (s) -> video-time (s)
  let v = TM.warp.lead_in + n;
  for (const ins of TM.warp.inserts) if (ins.at <= n) v += ins.dur;
  return v;
}
const cueV = (name, edge = 'start') => warp(TM.cues[name][edge]);

function setup() {
  D = window.DATA; TM = window.TIMING;
  TOTAL = TM.warp.total;
  window.TOTAL = TOTAL;
  const groupColor = [C.terra, C.teal, C.blue];
  RUNS = D.runs.map(r => {
    // colour map: a cluster made of a single natural group takes that group's colour,
    // a merged cluster takes the colour of its first group, extra clusters get orange.
    const used = new Set(), cmap = {};
    const ids = Object.keys(r.composition).map(Number).sort((a, b) => r.composition[b].length - r.composition[a].length || a - b);
    for (const id of ids) {
      const comp = r.composition[id];
      const g = comp[0];
      if (!used.has(g)) { cmap[id] = groupColor[g]; used.add(g); } else cmap[id] = C.orange;
    }
    return { ...r, cmap, crgb: Object.fromEntries(Object.entries(cmap).map(([k, v]) => [k, hex(v)])), n: r.iterations.length };
  });
  const r1 = RUNS[0], r2 = RUNS[1];
  T = {};
  T.ptsA = 1.15; T.ptsB = 3.3;
  T.groups = cueV('three_groups');
  T.k = cueV('k_three');
  T.seeds = cueV('random_seeds');
  T.R1 = cueV('random_seeds', 'end') + .35;
  T.second = cueV('second_run');
  T.D1 = (T.second - .4 - T.R1) / r1.n;
  T.R2i = T.second;
  T.R2 = T.second + .8;
  T.conv = cueV('converge');
  T.D2 = Math.min(.85, (T.conv - 1.0 - T.R2) / r2.n);
  T.split = cueV('splits'); T.merge = cueV('merges');
  T.noch = cueV('no_changes');
  T.cmp = T.conv - .1;
  T.q = cueV('question') - .25;
  T.cmpEnd = T.q + .05;
  T.opt = { A: cueV('opt_A'), B: cueV('opt_B'), C: cueV('opt_C'), D: cueV('opt_D') };
  T.optEnd = {};
  for (const b of TM.blocks) if (b.option) T.optEnd[b.option] = warp(b.end);
  T.final = cueV('final_q');
  T.inits = warp(TM.words.find(w => w.w.startsWith('initializations')).start);
  T.inertia = cueV('inertia');
  T.narrEnd = TM.warp.narration_end_video;
  // deterministic point reveal order
  const rnd = mulberry32(11);
  ORDER = D.points.map((_, i) => i).map(i => [rnd(), i]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  window.REVEAL = new Array(D.points.length); ORDER.forEach((p, k) => REVEAL[p] = k);
  buildCaptions();
}

// ------------------------------------------------------------- captions
// Emphasis is balanced across options A–D (two terms each) so no option is visually favoured.
const KEY = new Set(['k-means', 'converge', 'non-convex', 'minima', 'automatically', 'number',
  'distance', 'metric', 'global', 'optimum', 'inertia', 'initializations', 'random', 'seeds']);
const norm = w => w.replace(/[.,?!]$/g, '').toLowerCase();
function buildCaptions() {
  const words = TM.words.map(w => ({ w: w.w, s: warp(w.start), e: warp(w.end), key: KEY.has(norm(w.w)) && !(w.w === 'K' && false) }));
  CAPS = [];
  let cur = [];
  const flush = () => { if (cur.length) CAPS.push({ words: cur, s: cur[0].s, e: cur[cur.length - 1].e }); cur = []; };
  for (const w of words) {
    if (/^[A-D]\.$/.test(w.w)) { flush(); }
    cur.push(w);
    const len = cur.map(x => x.w).join(' ').length;
    if (/[.?!]$/.test(w.w) && !/^[A-D]\.$/.test(w.w)) flush();
    else if (/,$/.test(w.w) && len > 18) flush();
    else if (len > 44) flush();
  }
  flush();
}

// ------------------------------------------------------------- primitives
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function card(x, y, w, h, r = 34, a = 1, opts = {}) {
  ctx.save();
  ctx.globalAlpha *= a;
  ctx.shadowColor = 'rgba(70,50,30,0.07)'; ctx.shadowBlur = 28; ctx.shadowOffsetY = 8;
  rr(x, y, w, h, r); ctx.fillStyle = opts.fill || C.card; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = opts.lw || 2; ctx.strokeStyle = opts.stroke || C.border; ctx.stroke();
  ctx.restore();
}
function text(s, x, y, { font = SANS, size = 36, weight = 400, color = C.ink, align = 'left', base = 'alphabetic', alpha = 1, spacing = 0 } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  if (spacing) ctx.letterSpacing = spacing + 'px';
  ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, size, weight = 400, font = SANS, spacing = 0) {
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`; if (spacing) ctx.letterSpacing = spacing + 'px';
  const w = ctx.measureText(s).width; ctx.restore(); return w;
}
function wrap(s, maxW, size, weight = 400, font = SANS) {
  const words = s.split(' '), lines = []; let line = '';
  for (const w of words) {
    const tryL = line ? line + ' ' + w : w;
    if (measure(tryL, size, weight, font) > maxW && line) { lines.push(line); line = w; } else line = tryL;
  }
  if (line) lines.push(line);
  return lines;
}
// pill chip; returns its width
function chip(label, cx, cy, { size = 30, weight = 500, fill = C.card, color = C.ink, stroke = C.border, alpha = 1, scale = 1, padX = 26, h = 62, dot = null } = {}) {
  if (alpha <= 0.001) return 0;
  const tw = measure(label, size, weight) + (dot ? 30 : 0);
  const w = tw + padX * 2;
  ctx.save();

const DOM = [0.3, 9.3];

// ------------------------------------------------------------- K-Means run state
const GRAY = hex('#A79E91');
/** State of a precomputed K-Means run at time t. R = time of first assignment step, Dur = seconds per iteration. */
function runState(run, t, R, Dur) {
  const it = run.iterations, n = it.length;
  const colorOf = k => run.crgb[k];
  const st = { iter: 0, changed: null, inertia: null, converged: false, linesAlpha: 0, lineIter: 0, moving: [] };
  let cents = run.init_centroids.map(c => c.slice());
  let colors = D.points.map(() => GRAY);
  if (t >= R) {
    const i = Math.min(n - 1, Math.floor((t - R) / Dur));
    const tt = t - (R + i * Dur);
    const h = it[i], prevA = i > 0 ? it[i - 1].assign : null;
    // 1) assignment: points recolour to their nearest centroid (staggered by distance)
    const kA = tt / (0.36 * Dur);
    colors = D.points.map((p, j) => {
      const from = prevA ? colorOf(prevA[j]) : GRAY, to = colorOf(h.assign[j]);
      if (from === to) return to;
      return mixRGB(from, to, easeInOut(clamp(kA * 1.25 - (REVEAL[j] / D.points.length) * .25)));
    });
    st.linesAlpha = Math.sin(Math.PI * clamp(tt / (0.46 * Dur))) * (i === n - 1 ? .55 : 1);
    st.lineIter = i;
    // 2) update: centroids glide to the mean of their assigned points
    const kM = easeInOut(prog(tt, 0.44 * Dur, 0.94 * Dur));
    cents = h.centroids_before.map((b, k) => [lerp(b[0], h.centroids_after[k][0], kM), lerp(b[1], h.centroids_after[k][1], kM)]);

    st.iter = i + 1;
    st.changed = h.changed;
    const prevIn = i > 0 ? it[i - 1].inertia : null;
    st.inertia = prevIn == null ? h.inertia * kM + (1 - kM) * h.inertia : lerp(prevIn, h.inertia, kM);
    st.inertiaShown = i > 0 || kM > 0;

}

function sceneDataset(t) {

function sceneCompare(t) {
  const a = win(t, T.cmp, T.cmpEnd, .5);
  if (a <= 0.001) return;
  const r1 = RUNS[0], r2 = RUNS[1];
  const kT = easeInOut(prog(t, T.cmp, T.cmp + .9));
  ctx.save(); ctx.globalAlpha = a;
  // chips row
  const kc = prog(t, T.cmp + .4, T.cmp + .9);
  chipRow([
    { label: 'Same dataset', alpha: easeOut(kc), dot: { color: C.terra } },
    { label: 'Same K = 3', alpha: easeOut(prog(t, T.cmp + .55, T.cmp + 1.05)), dot: { color: C.terra } },
    { label: 'Different seeds', alpha: easeOut(prog(t, T.cmp + .7, T.cmp + 1.2)), dot: { color: C.ink, hollow: true } },
  ], 540, 318, 14);
  [r1, r2].forEach((r, i) => {
    const cc = CMPCARD[i];
    const ka = i === 0 ? easeOut(prog(t, T.cmp + .25, T.cmp + .85)) : kT;
    card(cc.x, cc.y, cc.w, cc.h, 30, ka);
    text(`Run ${i + 1}`, cc.x + 30, cc.y + 76, { font: SERIF, size: 44, weight: 600, alpha: ka });
    chip(`seed ${r.seed}`, cc.x + cc.w - 92, cc.y + 62, { size: 26, alpha: ka, h: 50, padX: 20 });
    const fs = finalState(r);
    const st = { colors: fs.colors, cents: fs.cents.map((c, k) => ({ p: c, color: r.cmap[k], alpha: 1 })), vor: { cents: fs.cents, colors: [0, 1, 2].map(k => r.crgb[k]), alpha: 1 } };
    let rect = MINI[i];
    if (i === 1) rect = { x: lerp(PLOT.x, MINI[1].x, kT), y: lerp(PLOT.y, MINI[1].y, kT), w: lerp(PLOT.w, MINI[1].w, kT), h: lerp(PLOT.h, MINI[1].h, kT) };
    drawPlot(rect, st, i === 0 ? ka : 1);
    // numbers
    const kn = easeOut(prog(t, T.cmp + .9 + i * .25, T.cmp + 1.4 + i * .25));
    text('Final inertia', cc.x + 30, cc.y + 620, { size: 28, color: C.muted, alpha: kn });
    text(r.final_inertia.toFixed(1), cc.x + 30, cc.y + 690, { font: SERIF, size: 64, weight: 600, color: C.ink, alpha: kn });
    text(`${r.n_iterations} iterations`, cc.x + cc.w - 30, cc.y + 690, { size: 28, color: C.muted, align: 'right', alpha: kn });
    const kz = prog(t, T.noch + i * .2, T.noch + .5 + i * .2);
    chip('Converged · 0 reassigned', cc.x + cc.w / 2, cc.y + 770, { size: 26, weight: 600, h: 54, padX: 18, fill: '#EEF4F2', stroke: '#CFE0DC', color: '#3E6B62', alpha: clamp(kz * 2), scale: .9 + .1 * easeOutBack(kz), dot: { color: C.teal } });
  });
  const kb = easeOut(prog(t, T.noch + .6, T.noch + 1.2));
  text('Same data. Same K. Different answers.', 540, 1326, { font: SERIF, size: 44, weight: 600, align: 'center', alpha: kb });
  ctx.restore();
}

function optionLayout() {
  if (optionLayout.cache) return optionLayout.cache;
  const qLines = wrap('Why does K-Means produce different results on the exact same dataset?', 840, 50, 600, SERIF);
  const qH = 108 + qLines.length * 64 + 30;
  const opts = TM.blocks.filter(b => b.option).map(b => ({ letter: b.option, lines: wrap(b.text.slice(3), 760, 35, 400) }));
  let y = 290 + qH + 26;
  for (const o of opts) { o.y = y; o.h = 52 + o.lines.length * 46; y += o.h + 18; }
  return optionLayout.cache = { qLines, qH, opts, bottom: y };
}

function sceneQuestion(t) {
  const a = prog(t, T.q, T.q + .6) * (1 - prog(t, TOTAL - .6, TOTAL - .05));
  if (a <= 0.001) return;
  const L = optionLayout();
  ctx.save(); ctx.globalAlpha = easeInOut(a);
  const kq = easeOut(prog(t, T.q, T.q + .7));
  ctx.save(); ctx.translate(0, (1 - kq) * 28);
  card(60, 290, 960, L.qH, 34, 1, { fill: '#FFFFFF' });
  asterisk(112, 352, 17, t * .25, C.terra, 1);
  text('QUESTION', 140, 362, { size: 26, weight: 700, color: C.terra, spacing: 3 });
  L.qLines.forEach((ln, i) => text(ln, 100, 290 + 108 + 52 + i * 64, { font: SERIF, size: 50, weight: 600 }));
  ctx.restore();
  for (const o of L.opts) {
    const s = T.opt[o.letter], e = T.optEnd[o.letter];
    const k = prog(t, s - .15, s + .5);
    if (k <= 0) continue;
    const ke = easeOut(k);
    // identical "now reading" highlight for every option (no answer is singled out)
    const reading = clamp(prog(t, s - .15, s + .25)) * (1 - prog(t, e, e + .5));
    ctx.save();
    ctx.globalAlpha *= ke;
    ctx.translate(60 + (1 - ke) * 50, o.y);
    card(0, 0, 960, o.h, 26, 1, { stroke: rgba(mixRGB(hex(C.border), hex(C.orange), reading)), lw: 2 + reading * 1.5 });
    if (reading > .001) { ctx.save(); ctx.globalAlpha *= reading; rr(0, 18, 7, o.h - 36, 3.5); ctx.fillStyle = C.orange; ctx.fill(); ctx.restore(); }
    ctx.beginPath(); ctx.arc(66, o.h / 2, 32, 0, Math.PI * 2); ctx.fillStyle = C.beige; ctx.fill();
    text(o.letter, 66, o.h / 2 + 2, { font: SERIF, size: 38, weight: 700, align: 'center', base: 'middle', color: C.ink });
    const ty = o.h / 2 - (o.lines.length - 1) * 23 + 12;
    o.lines.forEach((ln, i) => text(ln, 128, ty + i * 46, { size: 35, color: C.ink }));
    ctx.restore();
  }
  // experiment prompt chips under the options
  chipRow([
    { label: 'different initializations', alpha: easeOut(prog(t, T.inits - .1, T.inits + .4)), dot: { color: C.ink, hollow: true } },
    { label: 'inertia scores', alpha: easeOut(prog(t, T.inertia - .1, T.inertia + .4)), dot: { color: C.terra } },
  ], 540, L.bottom + 30, 16);
  ctx.restore();
}

function sceneThink(t) {
  const a = prog(t, T.narrEnd + .1, T.narrEnd + .7) * (1 - prog(t, TOTAL - .6, TOTAL - .05));
  if (a <= 0.001) return;
  const L = optionLayout();
  const cy = Math.max(L.bottom + 170, 1505);
  const span = TOTAL - .6 - (T.narrEnd + .3);
  const rem = clamp(1 - (t - (T.narrEnd + .3)) / span);
  ctx.save(); ctx.globalAlpha = easeInOut(a);
  const cx = 300;
  ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, cy, 62, 0, Math.PI * 2); ctx.strokeStyle = C.sand; ctx.stroke();
  if (rem > 0.002) { ctx.beginPath(); ctx.arc(cx, cy, 62, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * rem); ctx.strokeStyle = C.terra; ctx.stroke(); }
  const secs = Math.max(0, Math.ceil(rem * span));
  text(String(secs), cx, cy + 3, { font: SERIF, size: 52, weight: 600, align: 'center', base: 'middle' });
  text('Pause & think it through', 396, cy - 12, { font: SERIF, size: 42, weight: 600 });
  text('Comment your answer + your experiment', 396, cy + 36, { size: 29, color: C.muted });
  ctx.restore();
}

function drawCaption(t) {
  if (t > T.narrEnd + .6) return;
  let cap = null, ci = -1;
  for (let i = 0; i < CAPS.length; i++) {
    const c = CAPS[i], next = CAPS[i + 1];
    const end = next ? Math.min(next.s - .05, c.e + .9) : c.e + .6;
    if (t >= c.s - .12 && t < end) { cap = c; ci = i; break; }
  }
  if (!cap) return;
  const next = CAPS[ci + 1];
  const end = next ? Math.min(next.s - .05, cap.e + .9) : cap.e + .6;
  const a = Math.min(easeOut(prog(t, cap.s - .12, cap.s + .05)), (next && next.s - .05 < cap.e + .9) ? 1 : 1 - prog(t, end - .25, end));
  const size = 44, maxW = 880;
  // layout rich words
  const items = cap.words.map(w => ({ ...w, wt: w.key ? 700 : 500 }));
  items.forEach(w => w.width = measure(w.w, size, w.wt));
  const sp = measure(' ', size, 500);
  const lines = [[]]; let lw = 0;
  for (const w of items) {
    if (lines[lines.length - 1].length && lw + sp + w.width > maxW) { lines.push([]); lw = 0; }
    lw += (lines[lines.length - 1].length ? sp : 0) + w.width; lines[lines.length - 1].push(w);
  }
  const lineH = 60, boxH = lines.length * lineH + 44;
  const widths = lines.map(l => l.reduce((s, w, i) => s + w.width + (i ? sp : 0), 0));
  const boxW = Math.max(...widths) + 76;
  const L = optionLayout();
  const inQ = t > T.q;
  const top = inQ ? Math.max(1445, L.bottom + 82) : 1430;
  ctx.save(); ctx.globalAlpha = a;
  rr(540 - boxW / 2, top, boxW, boxH, 28); ctx.fillStyle = 'rgba(255,255,255,0.94)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = C.border; ctx.stroke();
  lines.forEach((l, li) => {
    let x = 540 - widths[li] / 2;
    const y = top + 22 + lineH * li + lineH / 2 + 2;
    for (const w of l) {
      const spoken = clamp((t - w.s + .06) / .12);
      const col = w.key ? C.terra : C.ink;
      text(w.w, x, y, { size, weight: w.wt, color: col, base: 'middle', alpha: .38 + .62 * spoken });
      x += w.width + sp;
    }
  });
  ctx.restore();
}

function drawEnd(t) {
  const k = prog(t, TOTAL - .55, TOTAL - .05);
  if (k <= 0) return;
  asterisk(540, 1730, 34, t * .2, C.terra, easeInOut(k) * .8);
}

// ------------------------------------------------------------- draw(t)
function draw(t) {
  if (!T) setup();
  t = clamp(t, 0, TOTAL);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  drawHeader(t);
  if (t < T.cmp + .6) sceneDataset(t);
  if (t > T.cmp - .01 && t < T.cmpEnd + .01) sceneCompare(t);
  if (t > T.q) sceneQuestion(t);
  sceneThink(t);
  drawCaption(t);
  drawEnd(t);
}
window.draw = draw;

// ------------------------------------------------------------- live preview
async function ensureData() {
  if (window.DATA && window.TIMING) return;
  const [d, tm] = await Promise.all([fetch('clustering_data.json').then(r => r.json()), fetch('timing.json').then(r => r.json())]);
  window.DATA = d; window.TIMING = tm;
}
window.ready = ensureData().then(setup);
if (!window.__RENDERING) {
  window.ready.then(() => {
    const aud = document.getElementById('aud');
    let t0 = performance.now(), useAudio = false;
    cv.addEventListener('click', () => {   // click: restart with sound (browsers block autoplay audio)
      aud.currentTime = 0; aud.play().then(() => { useAudio = true; }).catch(() => { useAudio = false; t0 = performance.now(); });
      t0 = performance.now();
    });
    const loop = now => {
      const t = useAudio && !aud.paused ? aud.currentTime : ((now - t0) / 1000) % (TOTAL + 1);
      draw(Math.min(t, TOTAL));
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
}
</script>
