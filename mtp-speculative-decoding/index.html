function cue(i, word = null, edge = 'start') {

}

}
// mixed-style single line: parts = [[str, color, weight], ...], centred on cx unless align='left'
function rich(parts, x, y, { size = 30, alpha = 1, align = 'center', f = SANS, maxW = 0 } = {}) {
  if (alpha <= 0) return;
  let total = parts.reduce((s, [str, , wt = 500]) => s + measure(str, size, wt, f), 0);
  let sz = size; if (maxW && total > maxW) { sz = size * maxW / total; total = maxW; }

  for (const [str, col, wt = 500] of parts) {
    text(str, cx, y, { size: sz, weight: wt, color: col, align: 'left', alpha, f });
    cx += measure(str, sz, wt, f);

function line(x1, y1, x2, y2, { color = C.faint, lw = 2, alpha = 1, dash = null, k = 1 } = {}) {
  if (alpha <= 0 || k <= 0) return;
  ctx.save(); ctx.globalAlpha = A * alpha; ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(lerp(x1, x2, k), lerp(y1, y2, k)); ctx.stroke(); ctx.restore();
}
function arrow(x1, y1, x2, y2, { color = C.ink2, lw = 3, alpha = 1, head = 13, dash = null, k = 1 } = {}) {
  if (alpha <= 0 || k <= 0) return;
  const ex = lerp(x1, x2, k), ey = lerp(y1, y2, k), a = Math.atan2(ey - y1, ex - x1);

function qbez(p0, p1, p2, k) { const u = 1 - k; return [u * u * p0[0] + 2 * u * k * p1[0] + k * k * p2[0], u * u * p0[1] + 2 * u * k * p1[1] + k * k * p2[1]]; }
function curveArrow(p0, p1, p2, { color = C.ink2, lw = 3, alpha = 1, head = 12, k = 1, dash = null } = {}) {
  if (alpha <= 0 || k <= 0) return;
  ctx.save(); ctx.globalAlpha = A * alpha; ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); const N = 40; for (let i = 0; i <= N * k; i++) { const p = qbez(p0, p1, p2, i / N); i ? ctx.lineTo(...p) : ctx.moveTo(...p); }
  ctx.stroke(); ctx.restore();

function dot(x, y, r, { fill = C.terra, alpha = 1, stroke = null, lw = 2 } = {}) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = A * alpha; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } ctx.restore();

function ring(x, y, r, k, { color = C.terra, track = C.beige, lw = 8, alpha = 1 } = {}) {
  ctx.save(); ctx.globalAlpha = A * alpha; ctx.lineWidth = lw; ctx.lineCap = 'round';

  dot(x, y, r, { fill: C.green, alpha });
  ctx.save(); ctx.globalAlpha = A * alpha; ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - r * 0.45, y + r * 0.02); ctx.lineTo(x - r * 0.1, y + r * 0.36); ctx.lineTo(x + r * 0.48, y - r * 0.34); ctx.stroke(); ctx.restore();
}
function cross(x, y, r, { alpha = 1, scale = 1, fill = C.red } = {}) {
  if (alpha <= 0 || scale <= 0) return; r *= scale;
  dot(x, y, r, { fill, alpha });
  ctx.save(); ctx.globalAlpha = A * alpha; ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.22; ctx.lineCap = 'round';
  const d = r * 0.38; ctx.beginPath(); ctx.moveTo(x - d, y - d); ctx.lineTo(x + d, y + d); ctx.moveTo(x + d, y - d); ctx.lineTo(x - d, y + d); ctx.stroke(); ctx.restore();
}
function qmark(x, y, r, { alpha = 1 } = {}) {
  dot(x, y, r, { fill: C.card, stroke: C.amber, lw: 3, alpha });
  text('?', x, y + 2, { size: r * 1.3, weight: 700, color: C.amber, alpha });
}
function chip(label, cx, cy, { size = 28, weight = 600, fill = C.card, color = C.ink, stroke = C.border, alpha = 1, h = 54, padX = 22, f = SANS, maxW = 900 } = {}) {
  const w = Math.min(maxW, measure(label, size, weight, f) + padX * 2);
  rr(cx - w / 2, cy - h / 2, w, h, h / 2, { fill, stroke, lw: 2, alpha, shadow: fill ? 6 : 0 });
  text(label, cx, cy + 1, { size, weight, color, alpha, f, maxW: w - padX * 2 + 2 });
  return w;
}
function hatch(x, y, w, h, { color = C.faint, alpha = 1, gap = 14 } = {}) {
  ctx.save(); ctx.globalAlpha = A * alpha; ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
  for (let d = -h; d < w; d += gap) { ctx.moveTo(x + d, y + h); ctx.lineTo(x + d + h, y); }
  ctx.stroke(); ctx.restore();
}

// ---------- tokens ----------
const TS = {
  context:  { fill: C.card, stroke: C.border, ink: C.ink },
  gen:      { fill: C.terraLight, stroke: C.terra, ink: C.ink },
  draft:    { fill: C.amberFill, stroke: C.amber, ink: C.amberInk, dash: [9, 6] },
  accepted: { fill: C.green, stroke: C.green, ink: '#FFFFFF' },
  rejected: { fill: C.red, stroke: C.red, ink: '#FFFFFF' },
  target:   { fill: C.ink, stroke: C.ink, ink: C.bg },
  ghost:    { fill: null, stroke: C.faint, ink: C.muted, dash: [7, 6] },
};
function mixStyle(a, b, k) {
  if (k <= 0) return a; if (k >= 1) return b;
  return { fill: mix(a.fill || C.bg, b.fill || C.bg, k), stroke: mix(a.stroke, b.stroke, k), ink: mix(a.ink, b.ink, k), dash: k < 0.5 ? a.dash : b.dash };
}
const TOK_PAD = 16, TOK_MIN = 62;
const tokW = (label, size) => Math.max(TOK_MIN * size / 30, measure(label, size, 600, MONO) + TOK_PAD * 2 * size / 30);
function token(label, cx, cy, { st = TS.context, size = 30, alpha = 1, scale = 1, w = null, h = null } = {}) {
  if (alpha <= 0 || scale <= 0) return;
  const tw = (w || tokW(label, size)) * scale, th = (h || size * 2.05) * scale;
  rr(cx - tw / 2, cy - th / 2, tw, th, 12 * scale, { fill: st.fill, stroke: st.stroke, lw: 2.5, alpha, shadow: st.fill ? 7 : 0, dash: st.dash });
  text(label, cx, cy + 1, { size: size * scale, weight: 600, color: st.ink, f: MONO, alpha });
}
// horizontal row layout that shrinks the font until the row fits maxW
function rowLayout(labels, cx, { size = 30, gap = 10, maxW = 880 } = {}) {
  let sz = size, ws, total;
  for (let i = 0; i < 20; i++) {
    ws = labels.map(l => tokW(l, sz)); total = ws.reduce((a, b) => a + b, 0) + gap * (labels.length - 1);
    if (total <= maxW) break; sz *= 0.96;
  }
  const xs = []; let x = cx - total / 2;
  ws.forEach(w => { xs.push(x + w / 2); x += w + gap; });
  return { xs, ws, size: sz, total };
}

// transformer block: rounded card with stacked layer bars; `sweep` (0..1) lights layers bottom->top
function transformer(x, y, w, h, { label = '', sub = '', layers = 4, sweep = -1, alpha = 1, accent = C.terra, labelSize = 30, compact = false } = {}) {
  if (alpha <= 0) return;
  const active = sweep >= 0 && sweep <= 1;
  rr(x, y, w, h, 22, { fill: C.card, stroke: active ? accent : C.border, lw: active ? 3 : 2, alpha, shadow: 14 });
  const top = label ? (compact ? 44 : 64) : 20, pad = 22, lh = (h - top - pad) / layers - 8;
  if (label) text(label, x + w / 2, y + (compact ? 25 : 36), { size: labelSize, weight: 650, color: C.ink, alpha, maxW: w - 40 });
  for (let i = 0; i < layers; i++) {
    const ly = y + h - pad - (i + 1) * (lh + 8) + 8;
    const lit = active ? clamp((sweep * (layers + 1)) - i) * (1 - clamp(sweep * (layers + 1) - i - 1.6)) : 0;
    rr(x + pad, ly, w - pad * 2, lh, 10, { fill: mix(C.beige, accent, 0.18 + 0.62 * lit), alpha });
    if (i === 0 && sub) text(sub, x + w / 2, ly + lh / 2 + 1, { size: 22, weight: 500, color: C.ink2, alpha, maxW: w - 80 });
  }
}
// small logit bar-chart (a next-token distribution); the top bar is highlighted
function logits(cx, baseY, seed, { alpha = 1, k = 1, w = 64, maxH = 62, color = C.terra } = {}) {
  if (alpha <= 0) return;
  const n = 5, bw = w / n - 3, top = Math.floor(hash(seed) * n);
  for (let i = 0; i < n; i++) {
    const hgt = (i === top ? 1 : 0.18 + 0.42 * hash(seed * 7 + i)) * maxH * easeOutCubic(clamp(k * 1.3 - i * 0.06));
    rr(cx - w / 2 + i * (bw + 3), baseY - hgt, bw, hgt, 3, { fill: i === top ? color : C.faint, alpha });
  }
}

// =====================================================================================
//  The running example (identical in narration and visuals)
//  prompt: "The capital of France is"   draft (MTP): "Paris" "." "It"
//  target greedy predictions: after "is" -> "Paris" ✓, after "Paris" -> "." ✓, after "." -> "The" ✗ (draft "It")
//  result: accept "Paris" "." , replace "It" with "The"; the prediction after "It" is discarded.
// =====================================================================================
const PROMPT = ['The', 'capital', 'of', 'France', 'is'];
const DRAFT = ['Paris', '.', 'It'];
const TARGET = ['Paris', '.', 'The'];
const CX = 540;

// ---------- Scene 1: autoregressive decoding ----------
function scene1(t) {
  const labels = [...PROMPT, 'Paris', '.', 'The'];
  const L = rowLayout(labels, CX, { size: 30, maxW: 880 });
  const rowY = 1080, bx = 190, by = 690, bw = 700, bh = 270;
  const steps = [cue(2, 'predicts'), cue(2, 'decoding'), cue(3, 'still')];
  const tIntro = cue(0, 'normally'), tPrompt = cue(1, 'the#2');

  text('One token at a time', CX, 470, { size: 48, weight: 700, color: C.ink, alpha: win(t, tIntro + 0.2, tPrompt + 1.2) });
  text('next-token prediction, repeated', CX, 530, { size: 30, color: C.ink2, alpha: win(t, tIntro + 0.6, tPrompt + 1.2) });

  // the model
  let sweep = -1, passIdx = -1;
  steps.forEach((g, k) => { const p = prog(t, g, g + 1.0); if (p > 0 && p < 1) { sweep = p; passIdx = k; } });
  transformer(bx, by, bw, bh, { label: 'Large language model', sub: 'one full forward pass', layers: 4, sweep, alpha: ep(t, tIntro, 0.6) });
  if (passIdx >= 0) text(`decoding step ${passIdx + 1}`, bx + bw - 26, by + 36, { size: 24, weight: 600, color: C.terra, align: 'right' });

  // prompt tokens (inputs, under the model)
  PROMPT.forEach((l, i) => {
    const a = ep(t, tPrompt + i * 0.12, 0.35);
    token(l, L.xs[i], rowY + (1 - a) * 18, { size: L.size, alpha: a, w: L.ws[i] });
  });
  // each step: inputs flow up, the model runs, one new token comes out and is appended
  steps.forEach((g, k) => {
    const slot = 5 + k, sx = L.xs[slot];
    const inP = prog(t, g, g + 0.5);
    for (let i = 0; i < slot; i++) {
      if (inP > 0 && inP < 1) dot(L.xs[i], lerp(rowY - 38, by + bh, easeInOutCubic(inP)), 6, { fill: C.terra, alpha: 0.8 * (1 - inP * 0.4) });
    }
    if (t > g - 0.3 && t < g + 1.9) token('', sx, rowY, { st: TS.ghost, size: L.size, w: L.ws[slot], alpha: win(t, g - 0.3, g + 1.95, 0.3, 0.2) });
    const outA = ep(t, g + 0.95, 0.3, easeOutBack);
    const mv = ep(t, g + 1.3, 0.65);
    if (t > g + 0.95) {
      const p = mv <= 0 ? [CX, 590] : qbez([CX, 590], [1010, 640], [sx, rowY], mv);
      const st = mixStyle(TS.gen, mv >= 1 ? TS.gen : TS.gen, 0);
      if (mv <= 0) arrow(CX, by - 6, CX, 628, { color: C.terra, k: ep(t, g + 0.85, 0.2) });
      token(labels[slot], p[0], p[1], { st, size: L.size, w: L.ws[slot], scale: mv > 0 ? 1 : outA });
      if (mv > 0 && mv < 1) curveArrow([CX + 40, 600], [1010, 640], [sx + 20, rowY - 42], { color: C.terra, alpha: 0.35 * (1 - mv), lw: 2, dash: [6, 8] });
    }
  });
  // bottleneck annotation
  const tb = cue(4, 'bottleneck');
  chip('Bottleneck: 1 full pass → 1 new token', CX, 450, { size: 30, color: C.terra, stroke: C.terra, alpha: ep(t, tb - 0.1, 0.4) });

  // dependency chain arcs: is -> Paris -> . -> The
  const td = cue(4, 'depends');
  for (let i = 4; i < 7; i++) {
    const k = ep(t, td + (i - 4) * 0.25, 0.45);
    curveArrow([L.xs[i], rowY + 40], [(L.xs[i] + L.xs[i + 1]) / 2, rowY + 105], [L.xs[i + 1], rowY + 42], { color: C.terra, lw: 3, k, head: 11 });
  }
  text('each new token depends on the previous one', CX, 1195, { size: 28, color: C.ink2, alpha: ep(t, td + 0.5, 0.4), italic: true });

  // counter: Sequential decoding steps 1 -> 2 -> 3
  const cA = ep(t, steps[0] - 0.3, 0.4);
  text('Sequential decoding steps', 300, 1290, { size: 30, weight: 650, color: C.ink, alpha: cA, align: 'center' });
  [0, 1, 2].forEach(k => {
    const x = 610 + k * 120, done = prog(t, steps[k], steps[k] + 1.0);
    ring(x, 1290, 34, done, { alpha: cA, lw: 7 });
    text(String(k + 1), x, 1292, { size: 32, weight: 700, color: done > 0 ? C.terra : C.muted, alpha: cA });
    if (k < 2) arrow(x + 44, 1290, x + 76, 1290, { color: C.faint, lw: 3, head: 10, alpha: cA });
  });
}

// ---------- Scene 2: Multi-Token Prediction architecture ----------
function scene2(t) {
  const s = SC.s2_mtp.start;
  const tQ = cue(5, 'several'), tName = cue(6, 'multi'), tMain = cue(7, 'next'), tAux = cue(7, 'auxiliary');
  const tMod = cue(7, 'modules'), tFut = cue(7, 'further');
  const L = rowLayout(PROMPT, CX, { size: 30 });
  const rowY = 1235, bx = 290, by = 815, bw = 500, bh = 330, hy = 752;
  const aBase = ep(t, s + 0.1, 0.6);
  PROMPT.forEach((l, i) => token(l, L.xs[i], rowY, { size: L.size, w: L.ws[i], alpha: aBase }));
  // activation flow: deterministic looping pulse from tokens up through the backbone
  const ph = ((t - s) * 0.7) % 1;
  for (let i = 0; i < 5; i++) {
    line(L.xs[i], rowY - 32, CX + (L.xs[i] - CX) * 0.35, by + bh, { color: C.faint, lw: 2, alpha: aBase });
    const q = easeInOutCubic(ph);
    dot(lerp(L.xs[i], CX + (L.xs[i] - CX) * 0.35, q), lerp(rowY - 32, by + bh, q), 5, { fill: C.terra, alpha: aBase * 0.6 * Math.sin(Math.PI * ph) });
  }
  transformer(bx, by, bw, bh, { label: 'Main transformer backbone', sub: 'shared layers', layers: 4, alpha: aBase, labelSize: 28,
    sweep: ((t - s) * 0.45) % 1 });
  line(CX, by, CX, hy + 22, { color: C.ink2, lw: 3, alpha: aBase });
  dot(CX, hy, 22, { fill: C.ink, alpha: aBase });
  text('h', CX, hy + 1, { size: 26, weight: 700, color: C.bg, f: MONO, alpha: aBase });
  text('hidden state', CX + 36, hy, { size: 22, color: C.ink2, align: 'left', alpha: aBase });

  text('Predict several future tokens', CX, 430, { size: 40, weight: 700, alpha: win(t, tQ - 0.2, tName - 0.2) });
  text('before the next full pass?', CX, 485, { size: 40, weight: 700, color: C.terra, alpha: win(t, tQ - 0.0, tName - 0.2) });

  // heads / modules
  const heads = [
    { x: 250, name: 'Main LM head', depth: 't+1', t0: tMain, role: 'next token' },
    { x: 540, name: 'MTP head / module 1', depth: 't+2', t0: tAux + 0.15, role: 'speculative' },
    { x: 830, name: 'MTP head / module 2', depth: 't+3', t0: tAux + 0.55, role: 'speculative' },
  ];
  const ghost = ep(t, tName, 0.5), hy2 = 585, oy = 445;
  heads.forEach((hd, k) => {
    const on = ep(t, hd.t0, 0.45);
    const col = DEPTH[k];
    line(CX, hy - 22, hd.x, hy2 + 42, { color: on > 0 ? col : C.faint, lw: on > 0 ? 3 : 2, alpha: Math.max(ghost * 0.6, on), k: Math.max(ghost, on) });
    rr(hd.x - 130, hy2 - 42, 260, 84, 18, { fill: on > 0 ? mix(C.card, col, 0.14 * on) : null, stroke: on > 0 ? col : C.faint, lw: 2.5,
      dash: on > 0 ? null : [7, 6], alpha: Math.max(ghost * 0.7, on), shadow: on > 0 ? 8 : 0 });
    text(hd.name, hd.x, hy2 - 8, { size: 23, weight: 650, color: on > 0 ? C.ink : C.muted, alpha: Math.max(ghost * 0.7, on), maxW: 236 });
    text(k === 0 ? 'predicts t+1' : `predicts ${hd.depth}`, hd.x, hy2 + 22, { size: 21, color: on > 0 ? col : C.muted, alpha: Math.max(ghost * 0.7, on) });
    // outputs
    const oA = k === 0 ? ep(t, tMain + 0.4, 0.4) : ep(t, tFut + (k - 1) * 0.3, 0.4, easeOutBack);
    arrow(hd.x, hy2 - 44, hd.x, oy + 38, { color: col, lw: 3, k: oA, head: 11 });
    if (oA > 0) {
      const st = k === 0 ? { fill: col, stroke: col, ink: '#fff' } : { fill: mix(C.card, col, 0.25), stroke: col, ink: C.ink, dash: [8, 6] };
      token(`token ${hd.depth}`, hd.x, oy, { st, size: 26, scale: oA, w: 200 });
    }
  });
  const tagA = ep(t, tFut + 0.7, 0.4);
  rr(400, 388, 560, 110, 24, { stroke: C.amber, lw: 2.5, dash: [10, 7], alpha: tagA });
  text('speculative — not confirmed output', 680, 372, { size: 22, weight: 650, color: C.amberInk, alpha: tagA });
  // design variants (not all MTP implementations look alike)
  const vA = ep(t, tMod, 0.5);
  [[250, 410], [540, 700]].forEach(([a, b]) => curveArrow([a + 132, hy2 + 8], [(a + b) / 2 + 40, hy2 + 60], [b - 132 + 0, hy2 + 14],
    { color: C.ink2, lw: 2, dash: [5, 6], alpha: vA * 0.8, head: 9 }));
  text('Designs vary:', 100, 1318, { size: 23, weight: 700, color: C.ink, align: 'left', alpha: vA });
  text('independent parallel heads (e.g. Medusa), or', 260, 1318, { size: 23, color: C.ink2, align: 'left', alpha: vA, maxW: 720 });
  text('sequential modules chained by the dashed links (e.g. DeepSeek-V3)', 100, 1354, { size: 23, color: C.ink2, align: 'left', alpha: vA, maxW: 880 });
}

// ---------- Scene 3: draft generation ----------
function scene3(t) {
  const s = SC.s3_draft.start;
  const tP = [cue(8, 'paris'), cue(8, 'period'), cue(8, 'another')], tLane = cue(8, 'token') + 0.25;
  const tProb = cue(9), tPred = cue(10, 'predictions'), tConf = cue(10, 'confirmed'), tSpec = cue(11, 'speculative');
  const tFirst = cue(12, 'first'), tDraft = cue(12, 'draft');
  const a0 = ep(t, s + 0.1, 0.5);
  const L = rowLayout(PROMPT, CX, { size: 30 });
  text('context', 100, 398, { size: 22, weight: 650, color: C.muted, align: 'left', alpha: a0 });
  PROMPT.forEach((l, i) => token(l, L.xs[i], 450, { size: L.size, w: L.ws[i], alpha: a0 }));
  arrow(CX, 492, CX, 548, { color: C.faint, lw: 3, alpha: a0 });
  // drafter
  rr(270, 555, 540, 120, 22, { fill: C.card, stroke: C.border, alpha: a0, shadow: 12 });
  text('MTP drafter', CX, 597, { size: 30, weight: 700, alpha: a0 });
  text('backbone + MTP heads / modules', CX, 637, { size: 22, color: C.ink2, alpha: a0 });
  DEPTH.forEach((c, k) => dot(735 + k * 22, 597, 7, { fill: c, alpha: a0 }));

  const laneY = 1000, laneX = 150, laneW = 780, slots = [395, 540, 685];
  const laneA = ep(t, tLane - 0.4, 0.5);
  const pulse = 0.5 + 0.5 * Math.sin((t - tDraft) * 6);
  const lanePulse = t > tDraft ? (1 - prog(t, tDraft + 1.4, tDraft + 2.0)) * pulse : 0;
  rr(laneX, laneY - 80, laneW, 160, 26, { fill: mix(C.amberFill, C.card, 0.45), stroke: mix(C.amber, C.terra, lanePulse), lw: 2.5 + 2 * lanePulse, dash: [12, 8], alpha: laneA });
  text('SPECULATIVE DRAFT', laneX + 26, laneY - 54, { size: 20, weight: 750, color: C.amberInk, align: 'left', alpha: laneA });
  text('unverified', laneX + laneW - 26, laneY - 54, { size: 20, weight: 600, color: C.amber, align: 'right', alpha: laneA });

  DRAFT.forEach((l, k) => {
    const born = ep(t, tP[k], 0.4, easeOutBack);
    if (born <= 0) return;
    const sx = 330 + k * 210, sy = 770;
    arrow(CX + (sx - CX) * 0.3, 678, sx, 735, { color: DEPTH[k], lw: 3, k: ep(t, tP[k] - 0.2, 0.3), alpha: 1 - ep(t, tLane, 0.4), head: 10 });
    const mv = ep(t, tLane + k * 0.12, 0.7);
    const x = lerp(sx, slots[k], mv), y = lerp(sy, laneY + 6, mv);
    const st = mixStyle({ fill: mix(C.card, DEPTH[k], 0.25), stroke: DEPTH[k], ink: C.ink }, TS.draft, mv);
    token(l, x, y, { st, size: 34, scale: born, w: 130 });
    text(['t+1', 't+2', 't+3'][k], x, y + 56, { size: 21, weight: 650, color: DEPTH[k], alpha: born });
  });
  // question mark above the draft, gently bobbing
  const qA = ep(t, tProb - 0.1, 0.4, easeOutBack);
  if (qA > 0) qmark(CX + 250, laneY - 120 + Math.sin((t - tProb) * 3) * 6, 26 * qA, { alpha: clamp(qA) });
  rich([['Only predictions — ', C.ink2, 500], ['not yet confirmed', C.terra, 700]], CX, 1135, { size: 30, alpha: ep(t, tPred, 0.4) });
  text('the main model has not checked these tokens', CX, 1180, { size: 25, color: C.ink2, alpha: ep(t, tConf, 0.4), italic: true });
  // pipeline overview
  const pA = ep(t, tSpec, 0.5);
  const stepsP = [['1', 'Draft', 'MTP'], ['2', 'Verify', 'main model'], ['3', 'Accept / correct', 'prefix']];
  stepsP.forEach(([n, a, b], k) => {
    const x = 210 + k * 330, act = k === 0 ? ep(t, tFirst, 0.4) : 0;
    rr(x - 140, 1240, 280, 110, 20, { fill: act ? mix(C.card, C.amberFill, act) : C.card, stroke: act ? C.amber : C.border, lw: act ? 3 : 2, alpha: pA, shadow: 8 });
    text(`${n}  ${a}`, x, 1280, { size: 27, weight: 700, color: C.ink, alpha: pA, maxW: 250 });
    text(b, x, 1318, { size: 22, color: C.ink2, alpha: pA });
    if (k < 2) arrow(x + 145, 1295, x + 182, 1295, { color: C.faint, lw: 3, head: 10, alpha: pA });
  });
  text('speculative decoding', CX, 1222 - 12, { size: 1, alpha: 0 });
}

// ---------- Scene 4: one batched verification pass ----------
function scene4(t) {
  const s = SC.s4_verify.start;
  const tNext = cue(13, 'next'), tVer = cue(13, 'verifies'), tSingle = cue(13, 'single'), tPass = cue(13, 'pass');
  const tHow = cue(14), tCausal = cue(14, 'causal'), tKey = cue(15), tInputs = cue(15, 'available');
  const labels = [...PROMPT, ...DRAFT];
  const L = rowLayout(labels, CX, { size: 30 });
  const rowY = 1125, bx = 100, by = 845, bw = 880, bh = 210;
  // inputs
  labels.forEach((l, i) => token(l, L.xs[i], rowY, { st: i < 5 ? TS.context : TS.draft, size: L.size, w: L.ws[i], alpha: ep(t, Math.max(s + 0.1, tNext - 0.3) + i * 0.06, 0.35) }));
  // feed + forward pass
  const feed = prog(t, tVer, tVer + 0.7);
  const sweep = t > tVer + 0.4 && t < tPass + 0.6 ? prog(t, tVer + 0.4, tPass + 0.6) : -1;
  transformer(bx, by, bw, bh, { label: 'Main (target) model — one forward pass', sub: 'all 8 positions in the same pass', layers: 3, sweep, alpha: ep(t, tNext, 0.5), labelSize: 28 });
  labels.forEach((l, i) => {
    const ver = i >= 4;
    line(L.xs[i], rowY - 34, L.xs[i], by + bh + 4, { color: ver ? C.terra : C.faint, lw: ver ? 3 : 2, alpha: ep(t, tVer, 0.4), k: easeInOutCubic(feed) });
  });
  // outputs: one next-token distribution per verification position (is, Paris, ., It)
  const outT = tPass + 0.4;
  [4, 5, 6, 7].forEach((i, k) => {
    const a = ep(t, outT + k * 0.12, 0.4);
    arrow(L.xs[i], by - 4, L.xs[i], by - 52, { color: C.terra, lw: 3, k: a, head: 10 });
    logits(L.xs[i], by - 62, 11 + k * 3, { alpha: a, k: a, w: 70, maxH: 60 });
  });

  check(590, 420, 18, { alpha: cA });
  text('1 batched verification pass', 618, 421, { size: 25, weight: 700, color: C.ink, align: 'left', alpha: cA, maxW: 350 });
  for (let k = 0; k < 3; k++) {          // three sequential mini passes (what verification is NOT)

  // the causal-attention puzzle and its answer

// ---------- Scene 5: causal attention mask ----------
function scene5(t) {
  const s = SC.s5_mask.start;
  const tPlace = cue(16, 'place'), tMask = cue(16, 'mask');
  const tEach = cue(17, 'each'), tOnly = cue(17, 'only'), tBefore = cue(17, 'before');
  const tPar = cue(18, 'that'), tParW = cue(18, 'parallel'), tLeak = cue(18, 'without');
  const labels = [...PROMPT, ...DRAFT], N = 8, cell = 84, gx = 262, gy = 492, R = 3;
  const a0 = ep(t, s + 0.1, 0.5);
  text('keys  (positions attended to)  →', gx + cell * N / 2, 380, { size: 24, weight: 650, color: C.ink2, alpha: a0 });
  text('queries ↓', 96, 470, { size: 22, weight: 650, color: C.ink2, align: 'left', alpha: a0 });
  // column labels (rotated)
  labels.forEach((l, j) => {
    ctx.save(); ctx.globalAlpha = A * a0; ctx.translate(gx + j * cell + cell / 2 - 6, gy - 14); ctx.rotate(-Math.PI / 4);
    ctx.font = font(23, 600, MONO); ctx.fillStyle = j >= 5 ? C.amberInk : C.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(l, 0, 0); ctx.restore();
  });
  // phase weights
  const hiRow = 6;                                  // query "." = verification position 3
  const focus = win(t, tEach, tPar + 0.1, 0.4, 0.3);
  const par = ep(t, tPar, 0.5);
  labels.forEach((l, i) => {
    const y = gy + i * cell + cell / 2;
    const rowDim = focus > 0 ? lerp(1, i === hiRow ? 1 : 0.32, focus) : (par > 0 ? lerp(1, i >= 4 ? 1 : 0.4, par) : 1);
    text(l, gx - 14, y, { size: 24, weight: 600, f: MONO, color: i >= 5 ? C.amberInk : C.ink, align: 'right', alpha: a0 * rowDim });
    if (i >= 4) text(`v${i - 3}`, 98, y, { size: 22, weight: 750, color: C.terra, align: 'left', alpha: a0 * rowDim });
    const rowT = lerp(tPlace, tMask, i / (N - 1));
    for (let j = 0; j < N; j++) {
      const a = ep(t, rowT + j * 0.03, 0.25);
      const x = gx + j * cell, yy = gy + i * cell, ok = j <= i;
      const fill = ok ? (j >= 5 ? '#EFC48F' : (j === i ? C.terra : '#E3AE97')) : '#EFEAE2';
      rr(x + 3, yy + 3, cell - 6, cell - 6, 9, { fill, alpha: a * rowDim });
      if (!ok) hatch(x + 3, yy + 3, cell - 6, cell - 6, { color: '#E0D8CC', alpha: a * rowDim });
    }
  });
  // highlight: v3 (".") sees the prompt + "Paris" + itself, but not the future token "It"
  if (focus > 0) {
    rr(gx - 2, gy + hiRow * cell - 2, cell * N + 4, cell + 4, 12, { stroke: C.ink, lw: 3, alpha: focus });
    const mA = ep(t, tBefore, 0.4) * focus;
    rr(gx + 7 * cell + 1, gy + hiRow * cell + 1, cell - 2, cell - 2, 10, { stroke: C.ink, lw: 3, dash: [6, 5], alpha: mA });
    text('masked', gx + 7.5 * cell, gy + hiRow * cell - 18, { size: 21, weight: 700, color: C.ink, alpha: mA });
    rich([['v3 (".") sees ', C.ink, 600], ['the prompt + "Paris"', C.terra, 750], [' — never "It"', C.ink, 600]], CX, 1225, { size: 30, alpha: ep(t, tOnly, 0.4) * focus, maxW: 900 });
  }
  // parallel phase: all verification rows (v1..v4) are computed together
  if (par > 0) {
    const sweepX = ((t - tPar) * 0.9) % 1;
    for (let i = 4; i < 8; i++) {
      const y = gy + i * cell;
      rr(gx - 2, y - 1, cell * N + 4, cell + 2, 10, { stroke: C.terra, lw: 2.5, alpha: par * 0.9 });
      const xx = gx + sweepX * (i + 1) * cell;       // identical phase on every row: same pass
      line(xx, y + 10, xx, y + cell - 10, { color: '#fff', lw: 5, alpha: par * 0.7 * Math.sin(Math.PI * sweepX) });
    }
    const bxr = gx + cell * N + 18, y1 = gy + 4 * cell + 6, y2 = gy + 8 * cell - 6;
    line(bxr, y1, bxr, y2, { color: C.terra, lw: 3, alpha: par }); line(bxr - 10, y1, bxr, y1, { color: C.terra, lw: 3, alpha: par }); line(bxr - 10, y2, bxr, y2, { color: C.terra, lw: 3, alpha: par });
    ctx.save(); ctx.globalAlpha = A * par; ctx.translate(bxr + 26, (y1 + y2) / 2); ctx.rotate(Math.PI / 2); ctx.font = font(22, 700); ctx.fillStyle = C.terra; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('one pass', 0, 0); ctx.restore();
    const pA = ep(t, tParW, 0.4);
    chip('Parallel computation: v1–v4 together', CX, 1222, { size: 27, color: C.terra, stroke: C.terra, alpha: pA });
    const lA = ep(t, tLeak, 0.4);
    chip('Causal information flow: no future leakage', CX, 1290, { size: 27, color: C.ink, stroke: C.ink, alpha: lA });
    // outline the masked upper triangle
    if (lA > 0) {
      ctx.save(); ctx.globalAlpha = A * lA * (0.6 + 0.4 * Math.sin((t - tLeak) * 5)); ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.moveTo(gx + cell, gy); ctx.lineTo(gx + N * cell, gy); ctx.lineTo(gx + N * cell, gy + (N - 1) * cell);
      for (let k = N - 1; k >= 1; k--) { ctx.lineTo(gx + k * cell, gy + k * cell); ctx.lineTo(gx + k * cell, gy + (k - 1) * cell); }
      ctx.closePath(); ctx.stroke(); ctx.restore();
    }
  }
  // legend
  const lg = a0 * (1 - Math.max(focus, par > 0 ? 1 : 0) * 0.0);
  const ly = 1356;
  rr(150, ly - 14, 28, 28, 6, { fill: '#E3AE97', alpha: lg }); text('allowed (past + self)', 190, ly, { size: 22, color: C.ink2, align: 'left', alpha: lg });
  rr(520, ly - 14, 28, 28, 6, { fill: '#EFEAE2', alpha: lg }); hatch(520, ly - 14, 28, 28, { color: '#D6CDBF', alpha: lg, gap: 8 });
  text('masked (future)', 560, ly, { size: 22, color: C.ink2, align: 'left', alpha: lg });
  if (focus <= 0 && par <= 0) text('Lower-triangular causal mask', CX, 1240, { size: 32, weight: 700, alpha: ep(t, tMask, 0.4) });
}

// ---------- Scene 6: acceptance & rejection (greedy) ----------
function scene6(t) {
  const s = SC.s6_accept.start;
  const tCmp = cue(19, 'compare'), tTgt = cue(19, 'target'), tGreedy = cue(20, 'greedy');
  const tM = [cue(20, 'first'), cue(20, 'two')], tThird = cue(20, 'third'), tAcc = cue(21, 'accept');
  const tRej = cue(21, 'reject'), tCont = cue(21, 'continue'), tCorr = cue(21, 'correct'), tSamp = cue(22), tPres = cue(22, 'preserve');
  const a0 = ep(t, s + 0.1, 0.5);
  const cols = { pos: 205, draft: 500, tgt: 745, res: 925 };
  const hy = 395, rows = [490, 590, 690], r4 = 778;
  text('input position', cols.pos, hy, { size: 22, weight: 700, color: C.muted, alpha: a0 });
  text('draft', cols.draft, hy, { size: 22, weight: 700, color: C.amberInk, alpha: ep(t, tCmp, 0.4) });
  text('target prediction', cols.tgt, hy, { size: 22, weight: 700, color: C.ink, alpha: ep(t, tTgt, 0.4) });
  chip('greedy: target = argmax', cols.tgt, 335 + 0, { size: 21, h: 40, padX: 16, color: C.ink2, alpha: ep(t, tGreedy, 0.4) * (1 - ep(t, tSamp, 0.3)) });
  const after = ['after "is"', 'after "Paris"', 'after "."'];
  const accK = ep(t, tAcc, 0.5), rejK = ep(t, tRej, 0.4);
  const L = rowLayout([...PROMPT, ...TARGET], CX, { size: 30 });
  const outY = 945;
  for (let k = 0; k < 3; k++) {
    const y = rows[k], ra = ep(t, Math.max(s + 0.1, tCmp - 0.2) + k * 0.12, 0.4);
    rr(90, y - 46, 900, 92, 20, { fill: C.card, stroke: C.beige, alpha: ra * 0.9 });
    text(after[k], cols.pos, y, { size: 26, weight: 600, color: C.ink2, f: MONO, alpha: ra });
    // draft token: amber -> green (accepted) / red (rejected) -> moves or vanishes
    const da = ep(t, tCmp + k * 0.15, 0.4);
    if (k < 2) {
      const fly = ep(t, tAcc + 0.45 + k * 0.15, 0.7);
      const st = mixStyle(TS.draft, TS.accepted, accK);
      token(DRAFT[k], cols.draft, y, { st: TS.ghost, w: 130, size: 32, alpha: fly > 0 ? 1 : 0 });
      token(DRAFT[k], lerp(cols.draft, L.xs[5 + k], fly), lerp(y, outY, fly), { st, size: lerp(32, L.size, fly), w: lerp(130, L.ws[5 + k], fly), alpha: da });
    } else {
      const st = mixStyle(TS.draft, TS.rejected, rejK);
      const gone = ep(t, tRej + 0.5, 0.6);
      token(DRAFT[k], cols.draft, y, { st, w: 130, size: 32, alpha: da * (1 - gone), scale: 1 - 0.35 * gone });
      if (gone > 0) { token(DRAFT[k], cols.draft, y, { st: TS.ghost, w: 130, size: 32, alpha: gone * 0.8 }); text('rejected', cols.draft, y + 62, { size: 20, weight: 700, color: C.red, alpha: gone }); }
    }
    const ta = ep(t, tTgt + k * 0.15, 0.4);
    const flyT = k === 2 ? ep(t, tCont, 0.8) : 0;
    if (k === 2 && flyT > 0) token(TARGET[k], cols.tgt, y, { st: TS.ghost, w: 130, size: 32 });
    token(TARGET[k], lerp(cols.tgt, L.xs[7], flyT), lerp(y, outY, flyT), { st: TS.target, size: lerp(32, L.size, flyT), w: lerp(130, L.ws[7], flyT), alpha: ta });
    text(k < 2 ? '=' : '≠', (cols.draft + cols.tgt) / 2, y, { size: 38, weight: 700, color: k < 2 ? C.green : C.red, alpha: ep(t, k < 2 ? tM[k] : tThird, 0.3) });
    if (k < 2) check(cols.res, y, 24, { scale: ep(t, tM[k], 0.35, easeOutBack) });

  PROMPT.forEach((l, i) => token(l, L.xs[i], outY, { size: L.size, w: L.ws[i], alpha: oA }));
  for (let k = 0; k < 3; k++) if (t < (k < 2 ? tAcc + 0.45 + k * 0.15 + 0.7 : tCont + 0.8)) token('', L.xs[5 + k], outY, { st: TS.ghost, w: L.ws[5 + k], size: L.size, alpha: oA });
  const accBr = ep(t, tAcc + 1.2, 0.4);
  line(L.xs[5] - L.ws[5] / 2, outY + 46, L.xs[6] + L.ws[6] / 2, outY + 46, { color: C.green, lw: 3, alpha: accBr });
  text('accepted prefix', (L.xs[5] + L.xs[6]) / 2, outY + 70, { size: 21, weight: 700, color: C.green, alpha: accBr });
  text('from target', L.xs[7] + 6, outY + 70, { size: 21, weight: 700, color: C.ink, alpha: ep(t, tCont + 0.8, 0.4) });
  chip('Accept matching prefix → correct mismatch → continue', CX, 1080, { size: 26, color: C.ink, stroke: C.terra, alpha: ep(t, tCorr, 0.45), maxW: 900 });
  text('one verification pass committed 3 tokens (2 accepted + 1 correction)', CX, 1136, { size: 22, color: C.ink2, alpha: ep(t, tCorr + 0.5, 0.4), maxW: 880 });
  // sampling-based decoding: probability-based acceptance (exact speculative sampling)
  const sA = ep(t, tSamp, 0.5);
  rr(90, 1175, 900, 200, 22, { fill: C.card, stroke: C.border, alpha: sA, shadow: 10 });
  text('Sampling-based decoding (exact):', 120, 1212, { size: 25, weight: 750, align: 'left', alpha: sA });
  rich([['accept dᵢ with probability ', C.ink2, 500], ['min(1, p(dᵢ) / q(dᵢ))', C.terra, 700]], 120, 1258, { size: 25, align: 'left', alpha: sA, f: SANS });

  text('p = target model, q = draft  →  output distribution = target’s', 120, 1342, { size: 22, color: C.ink2, align: 'left', alpha: ep(t, tPres, 0.4), maxW: 840 });
}

// ---------- Scene 8: when speculation fails ----------
function scene8(t) {
  const s = SC.s8_failure.start;

  const tIf = cue(30, 'if'), tRej = cue(30, 'rejected'), tOut = cue(30, 'outweigh');
  const a0 = ep(t, s + 0.1, 0.5);
  // each round: 3 draft verdicts (A accepted, R rejected, D discarded) + 1 token supplied by the target
  const panel = (y0, title, dotCol, rounds, t0, alpha, summary, sumCol, sumA) => {
    rr(80, y0, 920, 330, 24, { fill: C.card, stroke: C.border, alpha, shadow: 10 });
    dot(118, y0 + 42, 10, { fill: dotCol, alpha });
    text(title, 140, y0 + 42, { size: 28, weight: 750, align: 'left', alpha });
    text('illustrative', 970, y0 + 42, { size: 20, color: C.muted, align: 'right', alpha });
    rounds.forEach((r, k) => {
      const gx = 120 + k * 290, gy = y0 + 95, ra = ep(t, t0 + k * 0.45, 0.4);
      r.forEach((v, j) => {
        const x = gx + j * 64;
        if (v === 'A') { rr(x, gy, 56, 56, 10, { fill: C.green, alpha: ra }); check(x + 28, gy + 28, 16, { alpha: ra }); }
        else if (v === 'R') { rr(x, gy, 56, 56, 10, { fill: C.red, alpha: ra }); cross(x + 28, gy + 28, 16, { alpha: ra, fill: C.red }); }
        else { rr(x, gy, 56, 56, 10, { fill: '#F1ECE4', stroke: C.faint, dash: [5, 4], alpha: ra }); hatch(x, gy, 56, 56, { color: '#DED5C8', alpha: ra, gap: 10 }); }
      });
      rr(gx + 198, gy + 8, 52, 40, 10, { fill: C.ink, alpha: ra });
      text('+1', gx + 224, gy + 29, { size: 20, weight: 700, color: C.bg, alpha: ra });
      text(`pass ${k + 1}: ${r.filter(v => v === 'A').length + 1} tokens`, gx + 125, gy + 88, { size: 21, color: C.ink2, alpha: ra });
    });
    summary.forEach((l, i) => text(l, CX, y0 + 245 + i * 38, { size: i ? 22 : 26, weight: i ? 500 : 700, color: i ? C.ink2 : sumCol, alpha: sumA, maxW: 860 }));
  };
  panel(370, 'High acceptance rate', C.green, [['A', 'A', 'A'], ['A', 'A', 'A'], ['A', 'A', 'R']], s + 0.4, a0,
    ['11 tokens in 3 verification passes', 'most drafts accepted → far fewer sequential steps'], C.green, ep(t, s + 2.0, 0.4));
  const lowA = ep(t, tIf - 0.2, 0.45);
  panel(730, 'Low acceptance rate', C.red, [['R', 'D', 'D'], ['A', 'R', 'D'], ['R', 'D', 'D']], tIf, lowA,
    ['4 tokens in 3 passes ≈ standard decoding', 'plus drafting & verification overhead → can be slower'], C.red, ep(t, tOut, 0.4));
  // wasted work bracket
  const wA = ep(t, tRej, 0.4);
  rr(112, 817, 870, 76, 14, { stroke: C.red, lw: 2.5, dash: [8, 6], alpha: wA * 0.8 });
  text('wasted speculative work', 980, 800, { size: 21, weight: 700, color: C.red, align: 'right', alpha: wA });
  text('+1 = token supplied by the target (correction or bonus)', CX, 1092, { size: 20, color: C.muted, alpha: lowA });
  // factors
  const fA = ep(t, tF[0] - 0.4, 0.4);
  text('The speedup depends on', CX, 1145, { size: 26, weight: 700, alpha: fA });
  ['draft accuracy', 'verification cost', 'memory bandwidth', 'hardware efficiency'].forEach((l, k) => {
    const x = k % 2 ? 765 : 315, y = 1210 + Math.floor(k / 2) * 72;
    chip(l, x, y, { size: 26, color: k ? C.ink : C.terra, stroke: k ? C.border : C.terra, alpha: ep(t, tF[k] - 0.05, 0.35), h: 56 });
  });
}

// ---------- Scene 9: takeaway ----------
function scene9(t) {
  const s = SC.s9_takeaway.start;
  const tIdea = cue(31), tMtp = cue(32, 'mtp'), tTok = cue(32, 'tokens'), tSpec = cue(32, 'speculative'), tAcc = cue(32, 'accepted');
  const tFast = cue(32, 'faster'), tProv = cue(32, 'provided'), tEnd = cue(33, 'thats');
  const boxes = [
    { y: 400, title: 'MTP heads / modules', sub: 'propose future tokens', t0: tMtp, col: C.terra },
    { y: 580, title: 'Draft tokens', sub: 'speculative, unverified', t0: tTok, col: C.amber },
    { y: 760, title: 'Target verification', sub: 'one parallel pass, causal mask', t0: tSpec, col: C.ink },
    { y: 940, title: 'Accepted output', sub: 'matching prefix + correction', t0: tAcc, col: C.green },
  ];
  const ghost = ep(t, tIdea, 0.5);
  boxes.forEach((b, k) => {
    const on = ep(t, b.t0, 0.45);
    rr(150, b.y, 780, 130, 24, { fill: on > 0 ? C.card : null, stroke: on > 0 ? b.col : C.faint, lw: on > 0 ? 3 : 2, dash: on > 0 ? null : [8, 7], alpha: Math.max(ghost * 0.6, on), shadow: on > 0 ? 12 : 0 });
    text(b.title, 200, b.y + 50, { size: 34, weight: 750, align: 'left', color: on > 0 ? C.ink : C.muted, alpha: Math.max(ghost * 0.6, on) });
    text(b.sub, 200, b.y + 94, { size: 24, color: C.ink2, align: 'left', alpha: on });
    // mini icons
    const ix = 800, iy = b.y + 65;
    if (k === 0) DEPTH.forEach((c, j) => dot(ix - 30 + j * 34, iy, 12, { fill: c, alpha: on }));
    if (k === 1) DRAFT.forEach((l, j) => token(l, ix - 70 + j * 70, iy, { st: TS.draft, size: 22, w: 62, alpha: on }));
    if (k === 2) for (let i = 0; i < 4; i++) for (let j = 0; j <= i; j++) rr(ix - 44 + j * 22, iy - 44 + i * 22, 19, 19, 4, { fill: j === i ? C.terra : '#E3AE97', alpha: on });
    if (k === 3) [['Paris', TS.accepted], ['.', TS.accepted], ['The', TS.target]].forEach(([l, st], j) => token(l, ix - 70 + j * 70, iy, { st, size: 22, w: 62, alpha: on }));
    if (k < 3) {
      const ak = ep(t, boxes[k + 1].t0 - 0.35, 0.35);
      arrow(CX, b.y + 134, CX, b.y + 176, { color: C.ink2, lw: 3, k: ak, head: 11 });
    }
  });
  // closing flow: a dot travelling through the pipeline (deterministic loop)
  const flow = ep(t, tFast, 0.5);
  if (flow > 0) { const ph = ((t - tFast) * 0.35) % 1; dot(CX, lerp(400, 1070, easeInOutCubic(ph)), 9, { fill: C.terra, alpha: flow * Math.sin(Math.PI * ph) }); }
  const tg = ep(t, tEnd, 0.6);
  text('More accepted tokens', CX, 1150, { size: 44, weight: 800, color: C.terra, alpha: tg, maxW: 880 });
  text('per verification pass', CX, 1205, { size: 44, weight: 800, color: C.terra, alpha: ep(t, tEnd + 0.2, 0.6), maxW: 880 });
  text('= fewer sequential decoding steps', CX, 1270, { size: 40, weight: 750, color: C.ink, alpha: ep(t, tEnd + 0.5, 0.6), maxW: 880 });
  text('exact only with the right verification rule (greedy match / rejection sampling)', CX, 1340, { size: 21, color: C.muted, alpha: ep(t, tProv, 0.5) * (1 - 0.0), maxW: 880 });
  // final hold: gentle asterisk + disclosure
  const hold = ep(t, cue(33, null, 'end') + 0.5, 0.8);
  asterisk(CX, 1470, 34, (t - tEnd) * 0.25, { alpha: hold });
  text('Independent educational explainer · narration is AI-generated', CX, 1545, { size: 21, color: C.muted, alpha: hold, maxW: 860 });
}

const SCENES = [
  ['s1_autoregressive', scene1, '01', 'Autoregressive decoding'],
  ['s2_mtp', scene2, '02', 'Multi-Token Prediction (MTP)'],
  ['s3_draft', scene3, '03', 'Draft tokens'],
  ['s4_verify', scene4, '04', 'Verification'],
  ['s5_mask', scene5, '05', 'Causal attention mask'],
  ['s6_accept', scene6, '06', 'Accepted prefix'],
  ['s7_speedup', scene7, '07', 'Why it can be faster'],
  ['s8_failure', scene8, '08', 'When speculation fails'],
  ['s9_takeaway', scene9, '09', 'The takeaway'],
];
function sceneAlpha(t, i) {
  const sc = SC[SCENES[i][0]];
  const ain = i === 0 ? ep(t, 0.15, 0.6) : ep(t, sc.start, 0.5);
  const aout = i === SCENES.length - 1 ? 1 : 1 - ep(t, sc.end - 0.45, 0.45);
  return t < sc.start || t >= sc.end ? 0 : Math.min(ain, aout);
}

// ---------- header ----------
function header(t) {
  A = 1;
  asterisk(112, 205, 20, t * 0.15);
  text('MTP · speculative decoding', 146, 206, { size: 27, weight: 650, color: C.ink, align: 'left' });
  rr(760, 186, 222, 40, 20, { fill: C.beige });
  text('AI-generated narration', 871, 207, { size: 19, weight: 600, color: C.ink2 });
  SCENES.forEach(([id, , num, title], i) => {
    const a = sceneAlpha(t, i); if (a <= 0) return;
    A = a; text(num, 100, 280, { size: 30, weight: 800, color: C.terra, align: 'left' });
    text(title, 150, 280, { size: 40, weight: 750, color: C.ink, align: 'left', maxW: 830 }); A = 1;
  });
  // chapter progress
  SCENES.forEach(([id], i) => {
    const sc = SC[id], x = 100 + i * 100, k = prog(t, sc.start, sc.end);
    rr(x, 318, 90, 6, 3, { fill: C.beige });
    if (k > 0) rr(x, 318, 90 * k, 6, 3, { fill: C.terra });
  });
}

// ---------- captions (from aligned narration) ----------
const TERMS = [['multitoken', 'prediction'], ['autoregressive'], ['mtp'], ['speculative', 'decoding'], ['draft', 'tokens'], ['draft', 'sequence'],
  ['draft'], ['verifies'], ['verification'], ['verify'], ['causal', 'attention', 'mask'], ['causal', 'attention'], ['sequential'], ['sequentially'],
  ['accept'], ['accepted']];
const CAP_SIZE = 40, CAP_W = 820, CAP_LH = 54;
const CHUNKS = (() => {
  const out = [];
  SEG.forEach((s, si) => {
    const ws = s.words.map(w => ({ ...w, n: norm(w.w), key: false }));
    for (let i = 0; i < ws.length; i++) for (const term of TERMS) {
      if (term.every((p, k) => ws[i + k] && ws[i + k].n === p)) { term.forEach((_, k) => ws[i + k].key = true); i += term.length - 1; break; }
    }
    let cur = [];
    const lines = arr => { const ls = [[]]; let w = 0; for (const x of arr) { const xw = measure(x.w + ' ', CAP_SIZE, 650);
      if (w + xw > CAP_W && ls[ls.length - 1].length) { ls.push([]); w = 0; } ls[ls.length - 1].push(x); w += xw; } return ls; };
    const flush = () => { if (cur.length) out.push({ si, words: cur, lines: lines(cur) }); cur = []; };
    ws.forEach((w, i) => {
      if (cur.length && lines([...cur, w]).length > 2) flush();
      cur.push(w);
      const end = /[.?!]$/.test(w.w), soft = /[,:]$/.test(w.w);
      if ((end && cur.length >= 3 && i < ws.length - 1) || (soft && cur.length >= 7)) flush();
    });
    flush();
  });
  out.forEach((c, i) => {
    const s = SEG[c.si], first = out[i - 1] && out[i - 1].si === c.si ? c.words[0].start - 0.08 : s.start - 0.15;
    c.t0 = first;
    const next = out[i + 1];
    c.t1 = next ? (next.si === c.si ? next.words[0].start - 0.08 : Math.min(next.t0 ?? (SEG[next.si].start - 0.15), s.end + 0.9)) : s.end + 0.9;
  });
  out.forEach((c, i) => { const n = out[i + 1]; if (n && n.si !== c.si) c.t1 = Math.min(SEG[n.si].start - 0.15, c.words.at(-1).end + 0.9, SEG[c.si].end + 0.9); });
  return out;
})();
function captions(t) {
  A = 1;
  const c = CHUNKS.find(c => t >= c.t0 && t < c.t1); if (!c) return;
  const a = Math.min(ep(t, c.t0, 0.12), 1 - ep(t, c.t1 - 0.12, 0.12));
  const n = c.lines.length, boxH = n * CAP_LH + 44, cy = 1515, top = cy - boxH / 2;
  rr(90, top, 860, boxH, 26, { fill: 'rgba(255,253,249,0.94)', stroke: C.beige, lw: 2, alpha: a, shadow: 14 });
  c.lines.forEach((ln, li) => {
    const wsz = ln.map(w => measure(w.w + ' ', CAP_SIZE, 650)); const tot = wsz.reduce((p, q) => p + q, 0) - measure(' ', CAP_SIZE, 650);
    let x = 520 - tot / 2; const y = top + 22 + CAP_LH * li + CAP_LH / 2;
    ln.forEach((w, k) => {
      const said = t >= w.start - 0.05;
      const col = w.key ? (said ? C.terra : '#DDB3A2') : (said ? C.ink : '#B4ACA2');
      text(w.w, x, y, { size: CAP_SIZE, weight: w.key ? 800 : 650, color: col, align: 'left', alpha: a });
      x += wsz[k];
    });
  });
}

// ---------- the single deterministic entry point ----------
function draw(t) {
  t = clamp(t, 0, window.TOTAL);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // faint paper vignette (static)
  const g = ctx.createRadialGradient(W / 2, H * 0.42, 200, W / 2, H * 0.42, 1250);
  g.addColorStop(0, 'rgba(255,255,255,0.35)'); g.addColorStop(1, 'rgba(214,200,180,0.18)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  header(t);
  SCENES.forEach(([id, fn], i) => {
    const a = sceneAlpha(t, i); if (a <= 0) return;
    ctx.save(); A = a; ctx.translate(0, (1 - Math.min(1, a)) * 18); fn(t); ctx.restore();
  });
  A = 1;
  captions(t);
}
window.draw = draw;
window.ready = document.fonts.ready.then(() => { draw(0); return true; });

// ---------- live browser preview (synchronised to the narration audio) ----------
if (window.__RENDERING) document.body.classList.add('rendering');
else {
  const audio = document.getElementById('audio'), btn = document.getElementById('play'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
  const q = new URLSearchParams(location.search); let tNow = +(q.get('t') || 0);
  const show = t => { draw(t); tc.textContent = `${t.toFixed(2)} / ${window.TOTAL.toFixed(2)} s`; scrub.value = Math.round(t / window.TOTAL * 1000); };
  const loop = () => { if (!audio.paused) { tNow = audio.currentTime; show(tNow); requestAnimationFrame(loop); } };
  btn.onclick = () => { if (audio.paused) { audio.currentTime = tNow; audio.play(); btn.textContent = '❚❚ Pause'; requestAnimationFrame(loop); } else { audio.pause(); btn.textContent = '▶ Play'; } };
  audio.onended = () => { btn.textContent = '▶ Play'; };
  scrub.oninput = () => { tNow = scrub.value / 1000 * window.TOTAL; audio.currentTime = tNow; show(tNow); };
  document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); btn.click(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { tNow = clamp(tNow + (e.code === 'ArrowRight' ? 1 : -1), 0, window.TOTAL); audio.currentTime = tNow; show(tNow); } });
  window.ready.then(() => show(tNow));
}
