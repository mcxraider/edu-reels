<script>

function cue(i, word = null, edge = 'start') {
  const s = SEG[i];

// ---------- drawing primitives ----------
let A = 1;  // global alpha multiplier (scene fade)

  if (alpha <= 0 || k <= 0) return;

  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); const N = 40; for (let i = 0; i <= N * k; i++) { const p = qbez(p0, p1, p2, i / N); i ? ctx.lineTo(...p) : ctx.moveTo(...p); }
  ctx.stroke(); ctx.restore();
  if (k > 0.98) { const a = qbez(p0, p1, p2, 0.96), b = p2; arrow(a[0], a[1], b[0], b[1], { color, lw, alpha, head }); }
}
function dot(x, y, r, { fill = C.terra, alpha = 1, stroke = null, lw = 2 } = {}) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = A * alpha; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } ctx.restore();
}
function ring(x, y, r, k, { color = C.terra, track = C.beige, lw = 8, alpha = 1 } = {}) {
  ctx.save(); ctx.globalAlpha = A * alpha; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.strokeStyle = track; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  if (k > 0) { ctx.strokeStyle = color; ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke(); }
  ctx.restore();
}
// Claude-inspired asterisk motif (an original geometric mark, not a logo)
function asterisk(cx, cy, r, rot = 0, { color = C.terra, alpha = 1 } = {}) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = A * alpha; ctx.translate(cx, cy); ctx.rotate(rot); ctx.strokeStyle = color; ctx.lineCap = 'round';
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6, len = r * (i % 2 ? 0.78 : 1);
    ctx.lineWidth = r * 0.2; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.16, Math.sin(a) * r * 0.16);
    ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len); ctx.stroke();

}
function check(x, y, r, { alpha = 1, scale = 1 } = {}) {

  ctx.beginPath(); ctx.moveTo(x - r * 0.45, y + r * 0.02); ctx.lineTo(x - r * 0.1, y + r * 0.36); ctx.lineTo(x + r * 0.48, y - r * 0.34); ctx.stroke(); ctx.restore();

  ctx.save(); ctx.globalAlpha = A * alpha; ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.22; ctx.lineCap = 'round';
  const d = r * 0.38; ctx.beginPath(); ctx.moveTo(x - d, y - d); ctx.lineTo(x + d, y + d); ctx.moveTo(x + d, y - d); ctx.lineTo(x - d, y + d); ctx.stroke(); ctx.restore();
}
function qmark(x, y, r, { alpha = 1 } = {}) {
  dot(x, y, r, { fill: C.card, stroke: C.amber, lw: 3, alpha });
  text('?', x, y + 2, { size: r * 1.3, weight: 700, color: C.amber, alpha });
}
function chip(label, cx, cy, { size = 28, weight = 600, fill = C.card, color = C.ink, stroke = C.border, alpha = 1, h = 54, padX = 22, f = SANS, maxW = 900 } = {}) {
  const w = Math.min(maxW, measure(label, size, weight, f) + padX * 2);
  rr(cx - w / 2, cy - h / 2, w, h, h / 2, { fill, stroke, lw: 2, alpha, shadow: fill ? 6 : 0 });
  text(label, cx, cy + 1, { size, weight, color, alpha, f, maxW: w - padX * 2 + 2 });

  ctx.save(); ctx.globalAlpha = A * alpha; ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
  for (let d = -h; d < w; d += gap) { ctx.moveTo(x + d, y + h); ctx.lineTo(x + d + h, y); }

}

// ---------- tokens ----------
const TS = {
  context:  { fill: C.card, stroke: C.border, ink: C.ink },
  gen:      { fill: C.terraLight, stroke: C.terra, ink: C.ink },
  draft:    { fill: C.amberFill, stroke: C.amber, ink: C.amberInk, dash: [9, 6] },
  accepted: { fill: C.green, stroke: C.green, ink: '#FFFFFF' },
  rejected: { fill: C.red, stroke: C.red, ink: '#FFFFFF' },
  target:   { fill: C.ink, stroke: C.ink, ink: C.bg },
  ghost:    { fill: null, stroke: C.faint, ink: C.muted, dash: [7, 6] },
};
function mixStyle(a, b, k) {
  if (k <= 0) return a; if (k >= 1) return b;
  return { fill: mix(a.fill || C.bg, b.fill || C.bg, k), stroke: mix(a.stroke, b.stroke, k), ink: mix(a.ink, b.ink, k), dash: k < 0.5 ? a.dash : b.dash };
}
const TOK_PAD = 16, TOK_MIN = 62;
const tokW = (label, size) => Math.max(TOK_MIN * size / 30, measure(label, size, 600, MONO) + TOK_PAD * 2 * size / 30);
function token(label, cx, cy, { st = TS.context, size = 30, alpha = 1, scale = 1, w = null, h = null } = {}) {
  if (alpha <= 0 || scale <= 0) return;
  const tw = (w || tokW(label, size)) * scale, th = (h || size * 2.05) * scale;
  rr(cx - tw / 2, cy - th / 2, tw, th, 12 * scale, { fill: st.fill, stroke: st.stroke, lw: 2.5, alpha, shadow: st.fill ? 7 : 0, dash: st.dash });
  text(label, cx, cy + 1, { size: size * scale, weight: 600, color: st.ink, f: MONO, alpha });
}
// horizontal row layout that shrinks the font until the row fits maxW
function rowLayout(labels, cx, { size = 30, gap = 10, maxW = 880 } = {}) {
  let sz = size, ws, total;
  for (let i = 0; i < 20; i++) {
    ws = labels.map(l => tokW(l, sz)); total = ws.reduce((a, b) => a + b, 0) + gap * (labels.length - 1);
    if (total <= maxW) break; sz *= 0.96;
  }
  const xs = []; let x = cx - total / 2;
  ws.forEach(w => { xs.push(x + w / 2); x += w + gap; });
  return { xs, ws, size: sz, total };
}

// transformer block: rounded card with stacked layer bars; `sweep` (0..1) lights layers bottom->top
function transformer(x, y, w, h, { label = '', sub = '', layers = 4, sweep = -1, alpha = 1, accent = C.terra, labelSize = 30, compact = false } = {}) {
  if (alpha <= 0) return;
  const active = sweep >= 0 && sweep <= 1;
  rr(x, y, w, h, 22, { fill: C.card, stroke: active ? accent : C.border, lw: active ? 3 : 2, alpha, shadow: 14 });
  const top = label ? (compact ? 44 : 64) : 20, pad = 22, lh = (h - top - pad) / layers - 8;
  if (label) text(label, x + w / 2, y + (compact ? 25 : 36), { size: labelSize, weight: 650, color: C.ink, alpha, maxW: w - 40 });
  for (let i = 0; i < layers; i++) {
    const ly = y + h - pad - (i + 1) * (lh + 8) + 8;
    const lit = active ? clamp((sweep * (layers + 1)) - i) * (1 - clamp(sweep * (layers + 1) - i - 1.6)) : 0;
    rr(x + pad, ly, w - pad * 2, lh, 10, { fill: mix(C.beige, accent, 0.18 + 0.62 * lit), alpha });
    if (i === 0 && sub) text(sub, x + w / 2, ly + lh / 2 + 1, { size: 22, weight: 500, color: C.ink2, alpha, maxW: w - 80 });
  }
}
// small logit bar-chart (a next-token distribution); the top bar is highlighted
function logits(cx, baseY, seed, { alpha = 1, k = 1, w = 64, maxH = 62, color = C.terra } = {}) {
  if (alpha <= 0) return;
  const n = 5, bw = w / n - 3, top = Math.floor(hash(seed) * n);
  for (let i = 0; i < n; i++) {
    const hgt = (i === top ? 1 : 0.18 + 0.42 * hash(seed * 7 + i)) * maxH * easeOutCubic(clamp(k * 1.3 - i * 0.06));
    rr(cx - w / 2 + i * (bw + 3), baseY - hgt, bw, hgt, 3, { fill: i === top ? color : C.faint, alpha });
  }
}

// ---------- extra token styles for DFlash ----------
TS.mask = { fill: C.mask, stroke: C.maskLine, ink: C.muted, dash: [7, 6] };
TS.anchor = { fill: C.terraLight, stroke: C.terra, ink: C.ink };
TS.discard = { fill: null, stroke: C.faint, ink: C.muted, dash: [5, 6] };
const CX = 540;
// a morphing token: style/label A fades into style/label B (k: 0..1), with a soft pop
function morph(la, sa, lb, sb, cx, cy, k, { size = 30, w = null, alpha = 1 } = {}) {
  if (k < 1) token(la, cx, cy, { st: sa, size, w, alpha: alpha * (1 - k) });
  if (k > 0) token(lb, cx, cy, { st: sb, size, w, alpha: alpha * k, scale: lerp(0.86, 1, easeOutBack(k)) });
}
// row with fixed widths that fit the wider of two label sets (so morphing never changes layout)
function morphRow(a, b, cx, opts = {}) {
  const lab = a.map((x, i) => (measure(x, 30, 600, MONO) > measure(b[i] || '', 30, 600, MONO) ? x : b[i]));
  return rowLayout(lab, cx, opts);
}
function bracket(x1, x2, y, label, { color = C.green, alpha = 1, k = 1, up = true, size = 24 } = {}) {
  if (alpha <= 0) return;
  const d = up ? -14 : 14, xm = lerp(x1, x2, 0.5), hw = (x2 - x1) / 2 * k;
  line(xm - hw, y, xm + hw, y, { color, lw: 3, alpha });
  if (k > 0.98) { line(x1, y, x1, y - d, { color, lw: 3, alpha }); line(x2, y, x2, y - d, { color, lw: 3, alpha }); }
  text(label, xm, y + d * 1.9, { size, weight: 700, color, alpha: alpha * ep(k, 0.6, 0.4) });
}
function strike(cx, cy, w, { alpha = 1, k = 1 } = {}) { line(cx - w / 2, cy, cx + w / 2, cy, { color: C.red, lw: 3, alpha, k }); }

// =====================================================================================
//  Scene 1 — autoregressive decoding: one target forward pass per token
// =====================================================================================
function scene1(t) {
  const labels = ['Prompt', 'Tok 1', 'Tok 2', 'Tok 3', 'Tok 4', 'Tok 5'];
  const L = rowLayout(labels, CX, { size: 30, gap: 34, maxW: 900 });
  const a0 = ep(t, 0.2, 0.7);
  const tA = cue(1, 'autoregressively'), tE = cue(2, 'steps', 'end');
  const PD = 1.15, P = [0, 1, 2, 3, 4].map(k => lerp(tA, tE - PD, k / 4));
  let sweep = -1, cur = -1;
  P.forEach((p, k) => { const q = prog(t, p, p + PD); if (q > 0 && q < 1) { sweep = q; cur = k; } });
  transformer(240, 420, 600, 230, { label: 'Large Target Model', sub: 'full forward pass', layers: 3, sweep, alpha: a0, accent: C.terra });
  if (cur >= 0) text(`forward pass ${cur + 1}`, CX, 685, { size: 26, weight: 650, color: C.terra, alpha: a0 });

  const ry = 790;
  token('Prompt', L.xs[0], ry, { size: L.size, w: L.ws[0], alpha: a0 });
  P.forEach((p, k) => {
    const s = k + 1, x = L.xs[s];
    const ax = L.xs[k] + L.ws[k] / 2 + 5, bx = x - L.ws[s] / 2 - 5;
    arrow(ax, ry, bx, ry, { color: C.muted, lw: 2.5, head: 10, alpha: a0 * ep(t, p + 0.2, 0.3), k: ep(t, p + 0.2, 0.3) });
    if (t < p + PD * 0.85) token('', x, ry, { st: TS.ghost, size: L.size, w: L.ws[s], alpha: a0 * 0.7 });
    const f = prog(t, p + PD * 0.55, p + PD * 0.85);
    if (f > 0 && f < 1) dot(lerp(CX, x, easeInOutCubic(f)), lerp(650, ry - 34, easeInOutCubic(f)), 7, { fill: C.terra });
    const on = ep(t, p + PD * 0.8, 0.35, easeOutBack);
    if (t > p + PD * 0.8) token(labels[s], x, ry, { st: TS.gen, size: L.size, w: L.ws[s], scale: on });
  });

  // timeline of separate target forward passes
  const ta = ep(t, tA - 0.4, 0.5), bw = 150, gx = 18, x0 = 120, ty = 935;
  text('Target-model forward passes', x0, 892, { size: 28, weight: 650, color: C.ink, align: 'left', alpha: ta });
  P.forEach((p, k) => {
    const x = x0 + k * (bw + gx), q = prog(t, p, p + PD);
    rr(x, ty, bw, 58, 12, { fill: C.beige, alpha: ta });
    if (q > 0) rr(x, ty, bw * q, 58, 12, { fill: C.terra, alpha: ta });
    text(String(k + 1), x + bw / 2, ty + 30, { size: 28, weight: 700, color: q >= 1 ? '#fff' : (q > 0.5 ? '#fff' : C.muted), alpha: ta });
  });
  arrow(x0, ty + 82, x0 + 5 * bw + 4 * gx, ty + 82, { color: C.faint, lw: 2.5, head: 11, alpha: ta });
  text('time', x0 + 5 * bw + 4 * gx, ty + 108, { size: 22, color: C.muted, align: 'right', alpha: ta });

  // latency counter
  const n = P.filter(p => t >= p + PD).length;
  ring(150, 1105, 34, n / 5, { alpha: ta, lw: 7 });
  text(String(n), 150, 1107, { size: 30, weight: 750, color: C.terra, alpha: ta });
  rich([['sequential steps   ', C.ink, 650], [`latency ≈ ${n} × full pass`, C.ink2, 500]], 206, 1105, { size: 30, alpha: ta, align: 'left' });

  // GPU under-utilisation
  const tg = cue(3, 'powerful'), ga = ep(t, tg, 0.5);
  text('GPU compute used by one decoding step', x0, 1192, { size: 26, weight: 600, color: C.ink2, align: 'left', alpha: ga });
  rr(x0, 1218, 840, 42, 12, { fill: C.card, stroke: C.border, alpha: ga });
  hatch(x0 + 2, 1220, 836, 38, { alpha: ga * 0.8 });
  const used = 0.22 * ep(t, tg + 0.4, 0.8);
  rr(x0, 1218, 840 * used, 42, 12, { fill: C.terra, alpha: ga });
  text('mostly idle', x0 + 840 - 16, 1239, { size: 22, weight: 600, color: C.muted, align: 'right', alpha: ga * ep(t, tg + 1.0, 0.4) });

  chip('More tokens per expensive model call?', CX, 1335, { size: 32, color: C.terra, stroke: C.terra, alpha: ep(t, cue(4, 'multiple'), 0.45) });
}

// =====================================================================================
//  Scene 2 — speculative decoding: cheap sequential drafting, parallel verification
// =====================================================================================
const DR2 = ['sat', 'on', 'the', 'mat', 'today'];
function scene2(t) {
  const s = SC.s2_specdec.start;
  const tD = cue(6, 'smaller'), tP = cue(7, 'predicts'), tP1 = cue(7, null, 'end'), tV = cue(8, 'checks');
  const tAcc = cue(9, 'accepted'), tAdv = cue(9, 'advance'), tLoss = cue(10, 'preserves');
  text('Draft cheaply, verify in parallel', CX, 420, { size: 40, weight: 750, alpha: ep(t, cue(5, 'speculative'), 0.5) });

  const D = [0, 1, 2, 3, 4].map(k => lerp(tP + 0.1, tP1 - 0.25, k / 4)), DD = 0.42;
  let ds = -1; D.forEach(d => { const q = prog(t, d, d + DD); if (q > 0 && q < 1) ds = q; });
  transformer(110, 500, 330, 200, { label: 'Small Draft Model', layers: 2, accent: C.orange, labelSize: 26, compact: true, alpha: ep(t, tD, 0.5), sweep: ds });
  const vs = prog(t, tV + 0.25, tV + 1.35);
  transformer(500, 480, 470, 240, { label: 'Large Target Model', layers: 4, accent: C.terra, alpha: ep(t, s + 0.1, 0.5), sweep: vs > 0 && vs < 1 ? vs : -1 });
  text('drafts one token per step', 275, 730, { size: 22, color: C.amberInk, alpha: ep(t, tP, 0.4) });

  const L = rowLayout(DR2, CX, { size: 30, gap: 16, maxW: 760 }), ry = 860;
  text('context: "The cat …"', 110, 935, { size: 24, color: C.ink2, align: 'left', alpha: ep(t, tP - 0.3, 0.4), f: MONO });
  DR2.forEach((w, k) => {
    const d = D[k], x = L.xs[k];
    const f = prog(t, d, d + DD);
    if (f > 0 && f < 1) dot(lerp(275, x, easeInOutCubic(f)), lerp(700, ry - 34, easeInOutCubic(f)), 6, { fill: C.orange });
    if (t < d + DD) return;
    // verdicts: 4 accepted, the 5th rejected and replaced by the target's own token
    const vk = k < 4 ? ep(t, tAcc + k * 0.22, 0.3) : ep(t, tAcc + 0.95, 0.3);
    const st = k < 4 ? mixStyle(TS.draft, TS.accepted, vk) : mixStyle(TS.draft, TS.rejected, vk);
    token(w, x, ry, { st, size: L.size, w: L.ws[k], scale: ep(t, d + DD - 0.05, 0.3, easeOutBack) });
    if (k < 4) check(x, ry - 52, 16, { scale: ep(t, tAcc + k * 0.22, 0.3, easeOutBack) });
    else cross(x, ry - 52, 16, { scale: vk });
  });
  // parallel verification: all draft tokens go to the target at once
  const va = win(t, tV, tV + 1.6, 0.3, 0.4);
  DR2.forEach((_, k) => curveArrow([L.xs[k], ry - 36], [L.xs[k], 760], [lerp(560, 910, k / 4), 722], { color: C.terra, lw: 2.5, alpha: va, k: ep(t, tV, 0.4), head: 10 }));
  text('1 parallel verification pass', 735, 755, { size: 24, weight: 650, color: C.terra, alpha: ep(t, tV + 0.2, 0.4) });
  // the target supplies the corrected token where the draft failed
  const tc = ep(t, tAcc + 1.25, 0.4);
  token('.', L.xs[4], ry + 92, { st: TS.gen, size: L.size, w: L.ws[4], alpha: tc, scale: lerp(0.8, 1, tc) });
  text("target's token", L.xs[4], ry + 140, { size: 20, weight: 600, color: C.terra, alpha: tc });
  chip('4 accepted + 1 from target = 5 tokens, 1 target pass', CX, 1085, { size: 28, color: C.ink, alpha: ep(t, tAdv, 0.45), maxW: 900 });
  const la = ep(t, tLoss, 0.5);
  chip('Lossless: output distribution preserved', CX, 1205, { size: 30, fill: C.greenLight, stroke: C.green, color: '#3F6447', alpha: la });
  text('sampling rule: accept with prob. min(1, p/q), else resample from max(0, p − q)', CX, 1270, { size: 22, color: C.ink2, alpha: la, maxW: 900 });
  text('p = target, q = draft · greedy decoding: accept iff it equals the target\'s choice', CX, 1305, { size: 21, color: C.muted, alpha: la, maxW: 900 });
}

// =====================================================================================
//  Scene 3 — the remaining bottleneck: the drafter is still sequential
// =====================================================================================
function scene3(t) {
  const s = SC.s3_problem.start;
  const a0 = ep(t, s + 0.05, 0.5), tR = cue(12, 'autoregressively'), tF = cue(13, 'five'), tO = cue(14, 'overhead');

  text('Speculative decoding', 775, 430, { size: 32, weight: 750, alpha: a0 });
  text('draft, then verify', 775, 470, { size: 22, color: C.ink2, alpha: a0 });

  // left column: five full target passes, time flows downward

  }
  text('5 tokens · 5 target passes', 305, 1205, { size: 22, color: C.ink2, alpha: a0 });
  // right column: five dependent draft steps, then one verification pass
  for (let k = 0; k < 5; k++) {
    const y = 510 + k * 58, q = ep(t, tR + 0.3 + k * 0.32, 0.3);
    rr(650, y, 250, 46, 12, { fill: C.amberFill, stroke: C.amber, lw: 2.5, alpha: a0 * q });
    text(`draft step ${k + 1}`, 775, y + 24, { size: 22, weight: 650, color: C.amberInk, alpha: a0 * q });
    if (k < 4) arrow(775, y + 47, 775, y + 57, { color: C.amber, lw: 2.5, head: 8, alpha: a0 * ep(t, tR + 0.55 + k * 0.32, 0.2) });
  }
  const qv = ep(t, tR + 2.0, 0.4);
  rr(620, 812, 310, 120, 16, { fill: C.terra, alpha: a0 * qv });
  text('verify all 5', 775, 860, { size: 26, weight: 650, color: '#fff', alpha: a0 * qv });
  text('in parallel', 775, 894, { size: 22, color: '#fff', alpha: a0 * qv });
  arrow(1000, 520, 1000, 930, { color: C.faint, lw: 2.5, head: 11, alpha: a0 });
  text('time', 1000, 952, { size: 20, color: C.muted, alpha: a0 });
  // highlight the dependency chain inside the drafter
  const h = ep(t, tF, 0.4), pulse = 0.55 + 0.45 * Math.sin((t - tF) * 5);
  rr(632, 496, 286, 304, 18, { stroke: C.red, lw: 3.5, dash: [10, 8], alpha: h * (t > tF + 0.4 ? pulse : 1) });
  chip('still 5 sequential draft steps', 775, 1000, { size: 24, fill: C.redLight, stroke: C.red, color: '#8C3F38', alpha: h, padX: 18 });
  const o = ep(t, tO, 0.5);
  rr(110, 1245, 860, 125, 22, { fill: C.card, stroke: C.border, alpha: o, shadow: 10 });
  rich([['Drafting cost   ', C.ink2, 600], ['T', C.ink, 700], ['draft', C.ink2, 500], ['  =  γ · t', C.ink, 700], ['step', C.ink2, 500]], CX, 1290, { size: 36, alpha: o, f: SANS });
  text('grows linearly with the number of drafted tokens γ', CX, 1338, { size: 23, color: C.muted, alpha: o });
}

// =====================================================================================
//  Scene 4 — DFlash: one block-diffusion forward pass drafts the whole block
// =====================================================================================
const PR4 = ['Paris', 'is', 'a', 'city', 'in', 'France'];
const MS4 = ['Paris', 'MASK', 'MASK', 'MASK', 'MASK', 'MASK'];
function scene4(t) {
  const tT = cue(15, 'dflash'), tL = cue(16, 'lightweight'), tB = cue(17, 'block'), tS = cue(18, 'single'), tE = cue(18, 'entire');
  const tC = cue(19, 'five');
  rich([['DFlash', C.terra, 800], ['  —  Block Diffusion Drafting', C.ink, 700]], CX, 435, { size: 44, alpha: ep(t, tT, 0.5), maxW: 900 });
  const pass = prog(t, tS + 0.25, tE + 0.2);

    rr(110, y + (1 - a) * 14, 860, 175, 24, { fill: i === 2 ? '#FFF8F2' : C.card, stroke: i === 2 ? C.terra : C.border, lw: i === 2 ? 3 : 2, alpha: a, shadow: 12 });
    c.icon(150, y + 88, a);
    text(c.name, 440, y + 66, { size: 36, weight: 750, color: i === 2 ? C.terra : C.ink, align: 'left', alpha: a, maxW: 500 });
    text(c.line, 440, y + 116, { size: 27, weight: 500, color: C.ink2, align: 'left', alpha: a, maxW: 510 });
  });
  chip('Same target output distribution — just faster', CX, 1160, { size: 28, fill: C.greenLight, stroke: C.green, color: '#3F6447', alpha: ep(t, cue(40, 'without'), 0.5) * out });
  // end card
  const e = ep(t, tEnd + 0.5, 0.8);
  if (e <= 0) return;
  asterisk(CX, 640, 44, (t - tEnd) * 0.25, { alpha: e });
  text('DFlash:', CX, 770, { size: 76, weight: 800, color: C.terra, alpha: e });
  text('Parallel Drafting for', CX, 860, { size: 54, weight: 700, alpha: e });
  text('Faster LLM Inference', CX, 928, { size: 54, weight: 700, alpha: e });
  const e2 = ep(t, tEnd + 0.9, 0.7);
  text('Based on Chen et al. (2026)', CX, 1040, { size: 34, weight: 650, color: C.ink2, alpha: e2 });
  text('“DFlash: Block Diffusion for Flash Speculative Decoding”', CX, 1094, { size: 25, color: C.ink2, alpha: e2, maxW: 900, italic: true });
  text('arXiv:2602.06036 · ICML 2026', CX, 1134, { size: 24, color: C.muted, alpha: e2, f: MONO });
  text('Independent educational explainer · narration is AI-generated', CX, 1240, { size: 22, color: C.muted, alpha: e2, maxW: 900 });
}

const SCENES = [
  ['s1_bottleneck', scene1, '01', 'The decoding bottleneck'],
  ['s2_specdec', scene2, '02', 'Speculative decoding'],
  ['s3_problem', scene3, '03', 'The drafting bottleneck'],
  ['s4_dflash', scene4, '04', 'Block-parallel drafting'],
  ['s5_conditioning', scene5, '05', 'Hidden-state conditioning'],
  ['s6_verify', scene6, '06', 'Parallel verification'],
  ['s7_speed', scene7, '07', 'Why DFlash is faster'],
  ['s8_takeaway', scene8, '08', 'The takeaway'],
];
function sceneAlpha(t, i) {
  const sc = SC[SCENES[i][0]];
  const ain = i === 0 ? ep(t, 0.15, 0.6) : ep(t, sc.start, 0.5);
  const aout = i === SCENES.length - 1 ? 1 : 1 - ep(t, sc.end - 0.45, 0.45);
  return t < sc.start || t >= sc.end ? 0 : Math.min(ain, aout);
}

// ---------- header ----------
function header(t) {
  A = 1;
  asterisk(112, 205, 20, t * 0.15);
  text('DFlash · speculative decoding', 146, 206, { size: 27, weight: 650, color: C.ink, align: 'left' });
  rr(760, 186, 222, 40, 20, { fill: C.beige });
  text('AI-generated narration', 871, 207, { size: 19, weight: 600, color: C.ink2 });
  SCENES.forEach(([id, , num, title], i) => {
    const a = sceneAlpha(t, i); if (a <= 0) return;
    A = a; text(num, 100, 280, { size: 30, weight: 800, color: C.terra, align: 'left' });
    text(title, 150, 280, { size: 40, weight: 750, color: C.ink, align: 'left', maxW: 830 }); A = 1;
  });
  SCENES.forEach(([id], i) => {
    const sc = SC[id], w = 100, x = 100 + i * 112, k = prog(t, sc.start, sc.end);
    rr(x, 318, w, 6, 3, { fill: C.beige });
    if (k > 0) rr(x, 318, w * k, 6, 3, { fill: C.terra });
  });
}

// ---------- captions (from aligned narration) ----------
const TERMS = [['autoregressively'], ['autoregressive'], ['speculative', 'decoding'], ['draft', 'model'], ['target', 'model'],
  ['in', 'parallel'], ['blockdiffusion'], ['diffusion', 'model'], ['hiddenstate', 'features'], ['bidirectional', 'attention'], ['longest', 'valid', 'prefix'],
  ['single', 'forward', 'pass'], ['dflash'], ['masked', 'positions'], ['sequential'], ['sequentially'], ['verification'], ['acceptance', 'rates']];

const CAP_SIZE = 40, CAP_W = 820, CAP_LH = 54;
const CHUNKS = (() => {
  const out = [];
  SEG.forEach((s, si) => {
    const ws = s.words.map(w => ({ ...w, n: norm(w.w), key: false }));
    for (let i = 0; i < ws.length; i++) for (const term of TERMS) {
      if (term.every((p, k) => ws[i + k] && ws[i + k].n === p)) { term.forEach((_, k) => ws[i + k].key = true); i += term.length - 1; break; }
    }
    let cur = [];
    const lines = arr => { const ls = [[]]; let w = 0; for (const x of arr) { const xw = measure(x.w + ' ', CAP_SIZE, 650);
      if (w + xw > CAP_W && ls[ls.length - 1].length) { ls.push([]); w = 0; } ls[ls.length - 1].push(x); w += xw; } return ls; };
    const flush = () => { if (cur.length) out.push({ si, words: cur, lines: lines(cur) }); cur = []; };
    ws.forEach((w, i) => {
      if (cur.length && lines([...cur, w]).length > 2) flush();
      cur.push(w);
      const end = /[.?!]$/.test(w.w), soft = /[,:]$/.test(w.w);
      if ((end && cur.length >= 3 && i < ws.length - 1) || (soft && cur.length >= 7)) flush();
    });
    flush();
  });
  out.forEach((c, i) => {
    const s = SEG[c.si], first = out[i - 1] && out[i - 1].si === c.si ? c.words[0].start - 0.08 : s.start - 0.15;
    c.t0 = first;
    const next = out[i + 1];
    c.t1 = next ? (next.si === c.si ? next.words[0].start - 0.08 : Math.min(next.t0 ?? (SEG[next.si].start - 0.15), s.end + 0.9)) : s.end + 0.9;
  });
  out.forEach((c, i) => { const n = out[i + 1]; if (n && n.si !== c.si) c.t1 = Math.min(SEG[n.si].start - 0.15, c.words.at(-1).end + 0.9, SEG[c.si].end + 0.9); });
  return out;
})();
function captions(t) {
  A = 1;
  const c = CHUNKS.find(c => t >= c.t0 && t < c.t1); if (!c) return;
  const a = Math.min(ep(t, c.t0, 0.12), 1 - ep(t, c.t1 - 0.12, 0.12));
  const n = c.lines.length, boxH = n * CAP_LH + 44, cy = 1515, top = cy - boxH / 2;
  rr(90, top, 860, boxH, 26, { fill: 'rgba(255,253,249,0.95)', stroke: C.beige, lw: 2, alpha: a, shadow: 14 });
  c.lines.forEach((ln, li) => {
    const wsz = ln.map(w => measure(w.w + ' ', CAP_SIZE, 650)); const tot = wsz.reduce((p, q) => p + q, 0) - measure(' ', CAP_SIZE, 650);
    let x = 520 - tot / 2; const y = top + 22 + CAP_LH * li + CAP_LH / 2;
    ln.forEach((w, k) => {
      const said = t >= w.start - 0.05;
      const col = w.key ? (said ? C.terra : '#DDB3A2') : (said ? C.ink : '#B4ACA2');
      text(w.w, x, y, { size: CAP_SIZE, weight: w.key ? 800 : 650, color: col, align: 'left', alpha: a });
      x += wsz[k];
    });
  });
}

// ---------- the single deterministic entry point ----------
function draw(t) {
  t = clamp(t, 0, window.TOTAL);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // faint paper vignette (static)
  const g = ctx.createRadialGradient(W / 2, H * 0.42, 200, W / 2, H * 0.42, 1250);
  g.addColorStop(0, 'rgba(255,255,255,0.35)'); g.addColorStop(1, 'rgba(214,200,180,0.18)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  header(t);
  SCENES.forEach(([id, fn], i) => {
    const a = sceneAlpha(t, i); if (a <= 0) return;
    ctx.save(); A = a; ctx.translate(0, (1 - Math.min(1, a)) * 18); fn(t); ctx.restore();
  });
  A = 1;
  captions(t);
}
window.draw = draw;
window.ready = document.fonts.ready.then(() => { draw(0); return true; });

// ---------- live browser preview (synchronised to the narration audio) ----------
if (window.__RENDERING) document.body.classList.add('rendering');
else {
  const audio = document.getElementById('audio'), btn = document.getElementById('play'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
  const q = new URLSearchParams(location.search); let tNow = +(q.get('t') || 0);
  const show = t => { draw(t); tc.textContent = `${t.toFixed(2)} / ${window.TOTAL.toFixed(2)} s`; scrub.value = Math.round(t / window.TOTAL * 1000); };
  const loop = () => { if (!audio.paused) { tNow = audio.currentTime; show(tNow); requestAnimationFrame(loop); } };
  btn.onclick = () => { if (audio.paused) { audio.currentTime = tNow; audio.play(); btn.textContent = '❚❚ Pause'; requestAnimationFrame(loop); } else { audio.pause(); btn.textContent = '▶ Play'; } };
  audio.onended = () => { btn.textContent = '▶ Play'; };
  scrub.oninput = () => { tNow = scrub.value / 1000 * window.TOTAL; audio.currentTime = tNow; show(tNow); };
  document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); btn.click(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { tNow = clamp(tNow + (e.code === 'ArrowRight' ? 1 : -1), 0, window.TOTAL); audio.currentTime = tNow; show(tNow); } });
  window.ready.then(() => show(tNow));
}
</script>
