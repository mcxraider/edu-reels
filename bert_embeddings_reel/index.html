// ------------------------------------------------------------------ subtitles (drawn on canvas)
const CAP_TOP = 1430, CAP_SIZE = 44, CAP_LH = 58, CAP_MAXW = 860, CAP_CX = 520;
function drawCaption(t) {
  let ci = -1;
  for (let i = 0; i < CAPS.length; i++) if (t >= CAPS[i].s && t < CAPS[i].e) { ci = i; break; }
  if (ci < 0) return;
  const cap = CAPS[ci], nx = CAPS[ci + 1], pv = CAPS[ci - 1];
  const contIn = pv && cap.s - pv.e < .08, contOut = nx && nx.s - cap.e < .08;
  const a = Math.min(contIn ? 1 : easeOut(prog(t, cap.s, cap.s + .14)), contOut ? 1 : 1 - prog(t, cap.e - .2, cap.e));
  const items = cap.words.map(w => ({ ...w, width: measure(w.w, CAP_SIZE, 600) }));
  const sp = measure(' ', CAP_SIZE, 600);
  // greedy wrap, then rebalance into 2 lines when it overflows
  const totalW = items.reduce((s, w) => s + w.width, 0) + sp * (items.length - 1);
  const lines = [[]];
  if (totalW <= CAP_MAXW) lines[0] = items;
  else {
    let acc = 0, best = 1, bestD = 1e9;
    for (let i = 1; i < items.length; i++) {
      acc += items[i - 1].width + (i > 1 ? sp : 0);
      const d = Math.abs(acc - (totalW - acc - sp));
      if (d < bestD) { bestD = d; best = i; }
    }
    lines[0] = items.slice(0, best); lines[1] = items.slice(best);
  }
  const widths = lines.map(l => l.reduce((s, w, i) => s + w.width + (i ? sp : 0), 0));
  const boxW = Math.max(...widths) + 72, boxH = lines.length * CAP_LH + 36;
  ctx.save(); ctx.globalAlpha = a;
  ctx.shadowColor = 'rgba(80,55,30,.10)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
  rr(CAP_CX - boxW / 2, CAP_TOP, boxW, boxH, 28); ctx.fillStyle = 'rgba(255,254,251,0.97)'; ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.lineWidth = 2; ctx.strokeStyle = C.border; ctx.stroke();
  lines.forEach((l, li) => {
    let x = CAP_CX - widths[li] / 2;
    const y = CAP_TOP + 18 + CAP_LH * li + CAP_LH / 2 + 2;
    for (const w of l) {
      const said = t >= w.s - .04;
      const kw = isKW(w.w);
      text(w.w, x, y, { size: CAP_SIZE, weight: kw ? 700 : 600, base: 'middle', color: kw ? C.terra : C.ink, alpha: said ? 1 : .38 });
      x += w.width + sp;
    }
  });
  ctx.restore();
}
function drawFades(t) {
  const kin = 1 - prog(t, 0, .45);
  if (kin > 0) { ctx.save(); ctx.globalAlpha = kin; ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}

// ------------------------------------------------------------------ draw(t)
function draw(t) {
  if (!SC) setup();
  t = clamp(t, 0, TOTAL);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.setLineDash([]);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // soft warm vignette
  const g = ctx.createRadialGradient(540, 820, 200, 540, 820, 1250);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(228,217,199,0.35)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  asterisk(985, 1800, 40, t * .05, C.sand, .5);
  drawHeader(t);
  scene1(t); scene2(t); scene3(t); scene4(t); scene5(t); scene6(t); scene7(t); scene8(t);
  drawCaption(t);
  drawFades(t);
}
window.draw = draw;

// ------------------------------------------------------------------ live preview (play / pause / seek)
async function ensureData() { if (!window.TIMING) window.TIMING = await fetch('alignment.json').then(r => r.json()); }
window.ready = ensureData().then(setup);
if (!window.__RENDERING) {
  window.ready.then(() => {
    const aud = document.getElementById('aud'), btn = document.getElementById('play'), seek = document.getElementById('seek');
    const tl = document.getElementById('time'), snd = document.getElementById('sound');
    let playing = false, base = 0, t0 = 0, sound = true, scrub = 0;
    const now = () => playing ? (sound && !aud.paused ? aud.currentTime : base + (performance.now() - t0) / 1000) : scrub;
    const start = () => {
      playing = true; base = scrub >= TOTAL ? 0 : scrub; t0 = performance.now(); btn.textContent = '❚❚ Pause';
      if (sound) { aud.currentTime = base; aud.play().catch(() => { sound = false; snd.textContent = 'Sound: n/a'; }); }
    };
    const stop = () => { scrub = now(); playing = false; aud.pause(); btn.textContent = '▶ Play'; };
    btn.onclick = () => playing ? stop() : start();
    snd.onclick = () => { const t = now(); const was = playing; if (was) stop(); sound = !sound; snd.textContent = 'Sound: ' + (sound ? 'on' : 'off'); scrub = t; if (was) start(); };
    seek.oninput = () => { const was = playing; if (playing) stop(); scrub = +seek.value; if (was) start(); };
    document.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); btn.onclick(); }
      if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { const was = playing; if (was) stop(); scrub = clamp(now() + (e.code === 'ArrowRight' ? 5 : -5), 0, TOTAL); if (was) start(); }
    });
    const loop = () => {
      let t = now();
      if (t >= TOTAL) { if (playing) stop(); scrub = t = TOTAL; }
      draw(t); seek.value = t; tl.textContent = t.toFixed(2) + ' / ' + TOTAL.toFixed(1) + ' s';
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    // autoplay attempt (Chrome may require a click for sound)
    start();
  });
}
</script>
