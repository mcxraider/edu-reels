      T(a, X0 + 52, yy + 42 + (1 - p) * 14, { size: 27, weight: 700, color: C.ink });
      T(b, X0 + 52, yy + 74 + (1 - p) * 14, { size: 21, weight: 500, color: C.ink2 });
    });
  });
  A(ap(t, cue(51, 'transformer') - 0.3, 0.6), () => {
    T('Same transformer math.', CX, 1205, { size: 44, weight: 700, font: SERIF, color: C.ink2, align: 'center' });
  });
  A(ap(t, cue(52, 'schedule') - 0.2, 0.6), () => {
    T('Smarter scheduling & serving.', CX, 1270, { size: 44, weight: 700, font: SERIF, color: C.terra, align: 'center' });
  });
  A(ap(t, E(52) - 0.2, 0.8), () => mark(CX, 1360, 34, C.terra, (t - E(52)) * 0.15));
}

/* ---------------- scene table: boundaries come from the narration ---------------- */
let SC = []; const TR = 0.3;
function buildScenes() {
  const starts = [0, 6, 14, 20, 27, 34, 41, 48];
  const names = ['The problem', 'Prefill & decode', 'Interference', 'Disaggregation', 'KV-cache handoff', 'Performance', 'Trade-offs', 'Takeaway'];
  const fns = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8];
  SC = starts.map((s, k) => ({ name: names[k], from: k === 0 ? 0 : (E(s - 1) + S(s)) / 2, f: fns[k] }));
  SC.forEach((s, k) => { s.to = k < SC.length - 1 ? SC[k + 1].from : TOTAL; });
  build1(); build2();
}

/* ---------------- subtitles ---------------- */
let PHRASES = [];
function buildPhrases() {
  PHRASES = [];
  SENT.forEach(s => {
    const ws = s.words; let cur = [];
    ws.forEach((w, i) => {
      cur.push(w);
      const left = ws.length - 1 - i, punct = /[,.?;:!]$/.test(w.w);
      if ((punct && cur.length >= 2) || (cur.length >= 6 && left > 2) || left === 0) { PHRASES.push(cur); cur = []; }
    });
    if (cur.length) PHRASES.push(cur);
  });
  PHRASES = PHRASES.map(ws => ({ words: ws, start: LEAD + ws[0].start - 0.08, end: LEAD + ws[ws.length - 1].end }));
  PHRASES.forEach((p, i) => { const nx = PHRASES[i + 1]; p.end = Math.min(nx ? nx.start - 0.02 : Infinity, p.end + 0.55); });
}
function subtitles(t) {
  const ph = PHRASES.find(p => t >= p.start && t < p.end); if (!ph) return;
  const a = Math.min(ss(t, ph.start, ph.start + 0.12), 1 - ss(t, ph.end - 0.12, ph.end));
  const o = { size: 42, weight: 600 }, maxW = 840, lh = 54;
  const lines = [[]]; let lw = 0; const sp = tw(' ', o);
  ph.words.forEach(w => { const ww = tw(w.w, o); if (lw + ww > maxW && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push(w); lw += ww + sp; });
  const widths = lines.map(L => L.reduce((s, w) => s + tw(w.w, o), 0) + sp * (L.length - 1));
  const bw = Math.max(...widths) + 56, bh = lines.length * lh + 28, by = 1545 - bh / 2;
  A(a, () => {
    box(CX - bw / 2, by, bw, bh, 22, 'rgba(255,255,255,0.95)', C.line, 2);
    lines.forEach((L, li) => {
      let x = CX - widths[li] / 2; const y = by + 14 + lh * li + lh / 2 + 2;
      L.forEach(w => {
        const said = t >= LEAD + w.start, now = said && t < LEAD + w.end + 0.05;
        T(w.w, x, y, { ...o, color: now ? C.terra : said ? C.ink : C.mute, base: 'middle' });
        x += tw(w.w, o) + sp;
      });
    });
  });
}

/* ---------------- chrome ---------------- */
function chrome(t) {
  mark(124, 262, 20, C.terra);
  T('LLM INFERENCE · P/D DISAGGREGATION', 156, 272, { size: 23, weight: 700, color: C.ink2, track: 2.5 });
  const k = Math.max(0, SC.findIndex(s => t >= s.from && t < s.to)), idx = t >= TOTAL ? SC.length - 1 : k;
  T(`${String(idx + 1).padStart(2, '0')} / ${String(SC.length).padStart(2, '0')}`, X1, 272, { size: 23, weight: 700, color: C.mute, align: 'right' });
  const gp = 6, gw = (X1 - X0 - (SC.length - 1) * gp) / SC.length;
  SC.forEach((s, i) => { const x = X0 + i * (gw + gp), p = ss(t, s.from, s.to); box(x, 298, gw, 6, 3, C.line); if (p > 0) box(x, 298, gw * p, 6, 3, C.terra); });
  T('AI-generated narration (OpenAI TTS) · simplified, illustrative diagrams', X0, 338, { size: 19, color: C.mute });
}

/* ---------------- the frame function ---------------- */
function draw(t) {
  t = clamp(t, 0, TOTAL);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.setLineDash([]);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  A(0.05, () => mark(1010, 1820, 120, C.terra, 0.3));
  for (let k = 0; k < SC.length; k++) {
    const s = SC[k];
    const inA = k === 0 ? 1 : eio(ss(t, s.from - TR, s.from + TR));
    const outA = k === SC.length - 1 ? 1 : 1 - eio(ss(t, s.to - TR, s.to + TR));
    const a = Math.min(inA, outA); if (a <= 0.001) continue;
    ctx.save(); ctx.globalAlpha = a;
    ctx.translate(0, inA < 1 ? (1 - inA) * 24 : outA < 1 ? -(1 - outA) * 24 : 0);
    s.f(t); ctx.restore();
  }
  ctx.globalAlpha = 1;
  chrome(t); subtitles(t);
}

/* ---------------- boot & live preview ---------------- */
async function boot() {
  let tm = window.TIMING;
  if (!tm) { try { tm = await (await fetch('timings.json')).json(); } catch (e) { console.error('no timing data: run `node render.mjs --inject`'); return; } }
  await document.fonts.ready;
  initTiming(tm); buildScenes(); buildPhrases();
  window.draw = draw; window.SCENES = SC.map(s => ({ name: s.name, from: s.from, to: s.to }));
  draw(0);
  if (window.__RENDERING) { document.body.classList.add('rendering'); return; }
  preview();
}
function preview() {
  const audio = document.getElementById('audio'), btn = document.getElementById('play'), seek = document.getElementById('seek');
  const time = document.getElementById('time'), jump = document.getElementById('jump');
  seek.max = TOTAL;
  SC.forEach((s, i) => { const o = document.createElement('option'); o.value = s.from; o.textContent = `${i + 1}. ${s.name}`; jump.appendChild(o); });
  let playing = false, clock0 = 0, t0 = 0, cur = 0, hasAudio = false;
  audio.addEventListener('canplay', () => { hasAudio = true; }, { once: true });
  audio.addEventListener('error', () => { hasAudio = false; });
  const now = () => (playing ? (hasAudio ? audio.currentTime : t0 + (performance.now() - clock0) / 1000) : cur);
  function setT(t) { cur = clamp(t, 0, TOTAL); t0 = cur; clock0 = performance.now(); if (hasAudio) audio.currentTime = cur; }
  function frame() {
    const t = now();
    if (t >= TOTAL) { playing = false; btn.textContent = 'Play'; cur = TOTAL; audio.pause(); }
    draw(t); seek.value = t; time.textContent = `${t.toFixed(2)} / ${TOTAL.toFixed(2)}`;
    if (playing) requestAnimationFrame(frame);
  }
  btn.onclick = () => {
    if (playing) { cur = now(); playing = false; audio.pause(); btn.textContent = 'Play'; frame(); return; }
    if (cur >= TOTAL) setT(0);
    setT(cur); playing = true; btn.textContent = 'Pause';
    if (hasAudio) audio.play().catch(() => { hasAudio = false; clock0 = performance.now(); });
    requestAnimationFrame(frame);
  };
  document.getElementById('back').onclick = () => { setT(now() - 5); if (!playing) frame(); };
  seek.oninput = () => { setT(+seek.value); if (!playing) frame(); };
  jump.onchange = () => { setT(+jump.value + 0.01); if (!playing) frame(); };
  window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); btn.click(); } if (e.code === 'ArrowLeft') { setT(now() - 2); if (!playing) frame(); } if (e.code === 'ArrowRight') { setT(now() + 2); if (!playing) frame(); } });
  const q = new URLSearchParams(location.search).get('t'); if (q) setT(+q);
  frame();
}
window.ready = boot();
</script>
